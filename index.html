<script>
(()=>{'use strict';
const questions=[
{id:'q1',ref:'2026 考古題選擇題 1',chapter:1,topic:'輔導基本概念',icon:'🧭',q:'諮商員遇有心理疾病個案時，應如何處理？',opts:['輔導室主要對象是有心理問題的學生','學生輔導需由專業人員負責，一般教師不宜介入','轉介給精神科醫生','輔導室主要工作是心理測驗與建立學生資料'],a:2,ex:'DOCX 標示的正確答案是轉介給精神科醫生。題目考查輔導工作者遇到心理疾病個案時的專業轉介。',why:['題目問心理疾病個案的處置，不是界定輔導室對象。','考古題將此敘述列為錯誤選項；一般教師不宜介入不是本題答案。','正確。這是 DOCX 標示的正確答案。','考古題將此敘述列為錯誤選項，且沒有回答個案處置方式。'],key:'遇到心理疾病個案：依考古題選擇專業轉介。'},
{id:'q4',ref:'2026 考古題選擇題 4',chapter:8,topic:'個別輔導',icon:'🌷',q:'一位較被動、猶豫而不敢進入輔導室的學生，老師如何邀請較恰當？',opts:['承諾裡面有很多好玩的遊戲','注意到學生已到，邀請他進來找舒服的位置坐下','催促學生立刻進來，否則會後悔','威脅不進來就不讓他參加'],a:1,ex:'考古題答案選擇先接納學生已經到場，再以舒服、低壓力的方式邀請入內。',why:['以遊戲作為吸引承諾，並未如答案般先接納學生當下狀態。','正確。語氣承認學生已到，並給予安適入座的選擇。','催促與「會後悔」的說法增加壓迫感。','以取消參加作威脅，與接納式邀請不同。'],key:'邀請猶豫的學生時，先接納、再提供可選擇的舒適安排。'},
{id:'q2-history',ref:'考古題「輔導工作之發展歷史」第 1 題',chapter:2,topic:'輔導工作發展歷史',icon:'📜',q:'依考古題所列資料，我國《兒童福利法》修正公布的時間為何？',opts:['民國 82 年 2 月','民國 79 年 1 月','民國 69 年 6 月','民國 62 年 2 月'],a:0,ex:'此題依據 DOCX 中「輔導工作之發展歷史」段落的標示答案，選項為民國 82 年 2 月。本題考的是文件所列的歷史年份。',why:['正確。DOCX 標示的答案為民國 82 年 2 月。','這是題目中的干擾年份，不是 DOCX 標示答案。','這是題目中的干擾年份，不是 DOCX 標示答案。','這是題目中的干擾年份，不是 DOCX 標示答案。'],key:'按本份考古題記憶歷史時間；這是歷史題，不代表現行法規說明。'},
{id:'q3-org',ref:'考古題「組織人員與輔導方案」第 1 題',chapter:3,topic:'輔導組織與方案',icon:'🏫',q:'學校輔導工作的服務對象是誰？',opts:['全體學生','只有低學業成就學生','只有行為偏差學生','只有資優學生'],a:0,ex:'考古題答案為全體學生。其餘選項都把服務對象限縮為單一學生群體。',why:['正確。題目答案為全體學生。','低學業成就學生是其中一群，不是全部服務對象。','行為偏差學生是其中一群，不是全部服務對象。','資優學生是其中一群，不是全部服務對象。'],key:'學校輔導的對象：全體學生。'},
{id:'q4-life',ref:'考古題「生活輔導」第 10 題',chapter:4,topic:'生活輔導',icon:'🌿',q:'教師把反菸毒教育融入健康課程，讓學生理解危害並學會抗拒誘惑，屬於哪一類生活輔導？',opts:['治療性的生活輔導','預防性的生活輔導','恢復性的生活輔導','發展性的生活輔導'],a:1,ex:'考古題答案為預防性的生活輔導。題幹重點是透過課程降低問題發生的可能。',why:['題目描述的是事前教育，不是處理已發生的問題。','正確。以課程提升認識並預防不良事件，符合本題答案。','「恢復性」不是題目列出的生活輔導分類答案。','考古題答案不是發展性，而是預防性。'],key:'事前宣導、降低風險 → 預防性生活輔導。'},
{id:'q5-learn',ref:'考古題「學習輔導」第 19 題',chapter:5,topic:'學習輔導',icon:'📚',q:'依 Bandura（班杜拉）自我效能預期理論設計學習輔導時，下列哪一項不適合作為策略？',opts:['安排能獲得成就感的經驗','運用同儕楷模示範','肯定學科表現的進步','懲罰成績不佳的學生抄寫課文'],a:3,ex:'考古題答案為懲罰成績不佳的學生抄寫課文。其他選項分別呼應成功經驗、楷模和表現回饋；懲罰並非題目所列的自我效能策略。',why:['正向成功經驗是題目列出的策略之一。','同儕楷模是題目列出的策略之一。','肯定進步是題目列出的策略之一。','正確。考古題指出懲罰抄寫不是此理論的輔導策略。'],key:'自我效能策略：成功經驗、楷模示範、鼓勵進步。'},
{id:'q12-learn',ref:'考古題「學習輔導」第 12 題',chapter:5,topic:'學習輔導',icon:'⏱️',q:'六六討論法中，每組六人、每人發言一分鐘、討論六分鐘；下列哪項不是其必要條件？',opts:['每組六個人','每人發言一分鐘','討論時間六分鐘','每人提出六個問題'],a:3,ex:'考古題答案為「每人提出六個問題」。題幹已列出此討論法的組數、人數與時間安排。',why:['這是題幹列出的條件。','這是題幹列出的條件。','這是題幹列出的條件。','正確。題幹沒有要求每人提出六個問題。'],key:'六六法：六人一組、六分鐘、每人一分鐘。'},
{id:'q4-career',ref:'考古題「生涯輔導」第 4 題',chapter:6,topic:'生涯輔導',icon:'🧭',q:'一位 25 歲、已有幾年工作經驗並希望在工作上建立表現的成人，較符合 Super（舒伯）生涯發展的哪個階段？',opts:['試探階段','維持階段','建立階段','成長階段'],a:2,ex:'考古題答案為建立階段。題幹描述已進入職場並致力於建立工作表現。',why:['考古題答案不是試探階段。','考古題答案不是維持階段。','正確。符合題幹的職場建立情境，也是考古題標示的答案。','成長階段不是題幹描述的階段。'],key:'依本題情境：進入職場、力求建立表現 → 建立階段。'},
{id:'q4-data',ref:'考古題「學生資料搜集與運用」第 4 題',chapter:7,topic:'學生資料與測驗',icon:'📋',q:'一項測驗能測出它原本想測量之行為特性的程度，稱為什麼？',opts:['信度','效度','常模','效標'],a:1,ex:'考古題答案為效度。題幹描述的是測驗是否測到預定目標。',why:['信度描述測量的一致性，不是本題定義。','正確。效度關乎測驗是否測到所欲測量的特性。','常模是比較分數的參照資料，不是本題定義。','效標是評估時參照的標準，不是本題所問的測量品質。'],key:'效度：測驗是否測到原本要測的內容。'},
{id:'q8-empathy',ref:'考古題諮商名詞解析',chapter:8,topic:'個別輔導技巧',icon:'💛',q:'個案說「好朋友不理我了，我好傷心。」老師回應「朋友不理你，讓你覺得好難過。」這主要使用哪一項技巧？',opts:['同理','情感反映','澄清','面質'],a:0,ex:'DOCX 直接以這段對話作為同理的例子，說明老師準確理解並傳達了個案的傷心感受。',why:['正確。DOCX 將這個回應標示為同理。','情感反映也會捕捉情緒，但本題原解析將此例歸為同理。','澄清會針對模糊訊息進一步詢問。','面質會指出言行或感受間的差異。'],key:'同理：進入並理解當事人的感受，再把理解傳達給對方。'}
];

const extraQuestions=[
{id:'life-orientation',ref:'學生考古題｜生活輔導名詞題',chapter:4,topic:'生活輔導',icon:'🧭',q:'新生剛入學，教師帶他認識教室、保健室、作息與求助方式，這是哪一種服務？',opts:['定向服務','心理測驗','危機處遇','生涯決策'],a:0,ex:'定向服務幫助新生或轉學生熟悉新環境、作息、規範與求助資源，降低陌生感並促進適應。',why:['正確。題幹列出的環境、作息、規範與求助管道正是定向服務內容。','心理測驗是蒐集或評估資料的工具，並非帶領新生熟悉環境。','題幹沒有呈現危機或急迫安全事件。','題幹談的是入學適應，不是探索或選擇職涯。'],key:'定向服務＝協助新生／轉學生熟悉校園並適應。'},
{id:'life-logical',ref:'學生考古題｜生活輔導名詞題',chapter:4,topic:'生活輔導',icon:'🌿',q:'學生在午餐時嬉戲打翻湯，教師請他擦乾地板。這最符合哪一個管教原則？',opts:['邏輯後果','反應代價','隔離法','懲罰抄寫'],a:0,ex:'擦乾被自己打翻的湯與行為有直接、合理關聯，讓學生承擔並補救行為結果，屬邏輯後果。',why:['正確。後果與打翻湯的行為相關，重點是補救與負責。','反應代價是失去原有增強物，例如失去已取得的點數。','隔離是暫時移出可獲得增強的情境，本題沒有移離情境。','抄寫與打翻湯沒有直接關聯，屬無關的處罰。'],key:'邏輯後果：與行為有合理關聯，協助學生補救並負責。'},
{id:'life-premack',ref:'學生考古題｜生活輔導選擇題',chapter:4,topic:'生活輔導',icon:'📺',q:'學生完成較不喜歡的作業後，才可以進行喜歡的看電視活動，運用哪個原則？',opts:['普雷馬克原則','過度矯正','反應代價','消弱'],a:0,ex:'以較可能發生、較喜歡的活動（看電視）作為完成較不喜歡行為（作業）的增強，為普雷馬克原則。',why:['正確。高頻／偏好活動用來增強低頻／較不偏好的活動。','過度矯正要求超過原狀的修復或練習，不是安排偏好活動。','反應代價是移除增強物或特權。','消弱是停止提供維持某行為的增強，本題則是提供增強。'],key:'先完成較不喜歡的事，再做喜歡的事＝普雷馬克原則。'},
{id:'life-i-message',ref:'學生考古題｜生活輔導選擇題',chapter:4,topic:'生活輔導',icon:'💬',q:'下列哪一句最符合我訊息的表達方式？',opts:['你每次都很粗心，真讓人受不了。','你就是故意把水打翻的。','水打翻時我很擔心有人滑倒，請你幫忙擦乾。','大家都覺得你很麻煩。'],a:2,ex:'我訊息以具體行為、自己的感受或影響，以及清楚請求來表達，避免貼標籤與指責。',why:['以「你」開頭責備並使用概括標籤，容易引發防衛。','替對方推測故意，沒有表達自己的感受與請求。','正確。指出具體事件、自己的擔心，並提出可行請求。','代替他人評價與責怪，不是我訊息。'],key:'我訊息：具體事件＋我的感受／影響＋清楚請求。'},
{id:'life-assert',ref:'學生考古題｜生活輔導選擇題',chapter:4,topic:'生活輔導',icon:'🌱',q:'學生因成績不理想而自卑，也擔心同學不喜歡自己。哪種訓練較能幫助他適當表達需求並建立自我肯定？',opts:['自我肯定訓練','隔離法','反應代價','系統減敏感法'],a:0,ex:'自我肯定訓練協助學生適當表達想法、感受與需求，並增進自我肯定。',why:['正確。其目標與表達需求、改善自我肯定相符。','隔離法用於暫時移出增強情境，與自我表達能力不同。','反應代價是移除增強物，並不直接教導表達技巧。','系統減敏感法主要處理焦慮，逐步接觸焦慮情境並搭配放鬆。'],key:'自我肯定訓練：練習適當表達，強化自我肯定。'},
{id:'guidance-three-tier',ref:'第一章投影片｜學校輔導三級架構',chapter:1,topic:'輔導基本概念',icon:'🏫',q:'學校輔導三級架構中，面向全體學生、以預防與促進發展為重點的是哪一級？',opts:['初級／發展性輔導','二級／介入性輔導','三級／處遇性輔導','僅限個別諮商'],a:0,ex:'投影片將初級預防對應發展性輔導，主要服務全體學生；二級為介入性、三級為處遇性。',why:['正確。初級／發展性輔導以全體學生的預防與發展為重點。','二級／介入性輔導主要回應已有輔導需求者。','三級／處遇性輔導服務較嚴重或複雜需求。','學校輔導不只個別諮商，也包括發展、介入與處遇工作。'],key:'初級發展、二級介入、三級處遇。'},
{id:'guidance-def',ref:'第一章投影片｜輔導定義',chapter:1,topic:'輔導基本概念',icon:'💛',q:'依第一章投影片，輔導工作的核心目標為何？',opts:['替個人決定人生方向','協助個人了解、接納並發展自己，處理生活、學習與生涯問題','只針對有精神疾病者進行治療','以測驗分數分類學生'],a:1,ex:'投影片將輔導描述為運用專業技巧協助個人了解自己、接納自我、充分發展，並處理生活、學習與生涯問題，以促進適應、成長與發展。',why:['替個人決定方向會取代其自主性，不符合協助自我引導的精神。','正確。涵蓋了解接納自我、發展及生活／學習／生涯問題。','輔導服務對象與工作面向不只精神疾病治療。','測驗可作為資料來源之一，但不是輔導的核心目標。'],key:'輔人自導：協助了解、接納、發展自我並處理生活學習生涯問題。'},
{id:'learning-organization',ref:'學生考古題｜學習輔導名詞題',chapter:5,topic:'學習輔導',icon:'🧠',q:'兒童把沙發、椅子、桌子歸成家具，把香蕉、蘋果、橘子歸成水果，以協助記憶，使用何種策略？',opts:['組織化策略','複誦策略','精緻化策略','後設記憶'],a:0,ex:'把零散資訊依共同特徵分類成類別，是組織化策略，可讓資訊更有系統並利於提取。',why:['正確。依類別整理零散項目即組織化。','複誦是重複念誦或練習，不是分類。','精緻化是增加聯想、意義或新舊資訊連結。','後設記憶是對自己記憶歷程的認識，不是題幹所述操作。'],key:'分類整理多項資訊＝組織化；替單一資訊增加聯想＝精緻化。'},
{id:'learning-sq3r',ref:'有效的學習方法講義｜SQ3R',chapter:5,topic:'學習輔導',icon:'📖',q:'SQ3R 中的 Q（Question，提問）是指什麼？',opts:['針對教材提出問題','快速背誦教材','製作心像聯想','檢查考試分數'],a:0,ex:'講義說明 Q 是發問：概覽教材後提出相關問題，再進行閱讀、背誦與複習。',why:['正確。Q 是 Question（提問），針對瀏覽教材提出問題。','背誦對應 Recite，不是 Q。','心像聯想是另一種記憶策略。','檢查分數不是 SQ3R 的 Q 步驟。'],key:'SQ3R：S（Survey，瀏覽）、Q（Question，提問）、R（Read，閱讀）、R（Recite，背誦／自述）、R（Review，複習）。'},
{id:'learning-pqrst',ref:'有效的學習方法講義｜PQRST',chapter:5,topic:'學習輔導',icon:'📝',q:'PQRST 讀書法中的 S（State，自述）主要做什麼？',opts:['用自己的話自述重點並嘗試回答問題','快速預覽教材','精讀教材','進行自我測驗'],a:0,ex:'講義中的 State 是讓學生用自己的話說出要點並嘗試回答問題，再作自省。',why:['正確。S 是自述，以自己的話重述並嘗試作答。','快速預覽是 P（Preview，預覽）。','精讀確認知識是 R（Read，閱讀）。','自我測驗是 T（Test，測驗）。'],key:'PQRST：P（Preview，預覽）、Q（Question，提問）、R（Read，閱讀）、S（State，自述）、T（Test，測驗）。'},
{id:'learning-metacog',ref:'學生考古題｜學習輔導選擇題',chapter:5,topic:'學習輔導',icon:'🔍',q:'學生讀一段文字後停下來問自己「我看懂了嗎？」，並用自己的話說明內容，主要在運用什麼？',opts:['後設認知的監控','單純複誦','反應代價','外在歸因'],a:0,ex:'自我提問並解釋理解內容，可監控自己是否讀懂，屬後設認知的監控。',why:['正確。學習者主動檢查並監控自己的理解。','不只是重複讀音，而是在檢視理解狀態。','反應代價是行為改變技術，與理解監控無關。','外在歸因是將結果歸因於個人以外因素。'],key:'後設認知三要素：計畫、監控、評估。'},
{id:'learning-weiner-effort',ref:'學生考古題｜Weiner（溫納）歸因',chapter:5,topic:'學習輔導',icon:'🎯',q:'學生說「這次考得好，是因為我這週很努力準備。」依 Weiner（溫納）歸因向度，努力最符合哪一組？',opts:['內在、不穩定、可控制','內在、穩定、不可控制','外在、不穩定、不可控制','外在、穩定、可控制'],a:0,ex:'努力來自個人（內在），每次可有不同程度（不穩定），且可由自己調整（可控制）。',why:['正確。努力＝內在、不穩定、可控制。','能力通常被視為內在、相對穩定、較不可控制；努力不是能力。','努力不是外在因素。','努力會變動，也可調整，不是穩定且不可控制。'],key:'努力：內在、不穩定、可控制；能力：內在、穩定、較不可控制。'},
{id:'learning-goal',ref:'學生考古題｜目標導向',chapter:5,topic:'學習輔導',icon:'🌟',q:'學生說「這次準備考試讓我學到很多，下次想再更努力」，較符合哪種目標導向？',opts:['趨向精熟目標','迴避表現目標','趨向表現目標','迴避精熟目標'],a:0,ex:'學生關注學會更多與持續進步，而非和他人比較，並朝向學習成長，屬趨向精熟目標。',why:['正確。重視理解、學習與進步，並積極追求。','沒有避免顯得比別人差的線索。','趨向表現通常重視勝過他人或展現能力。','題幹沒有逃避學習或避免不理解的意思。'],key:'精熟看學會與進步；表現看能力展現或與他人比較。'},
{id:'learning-autonomy',ref:'學生考古題｜自主需求',chapter:5,topic:'學習輔導',icon:'🌱',q:'教師想滿足學生的自主需求，下列哪種做法較合適？',opts:['提供可行的選擇，並讓學生為選擇負責','只增加懲罰強度','替學生決定所有學習方法','只強調成績對未來的外在價值'],a:0,ex:'提供選擇並讓學生承擔選擇結果，可增加自主感與責任感。',why:['正確。選擇與承擔結果都支持自主需求。','加重懲罰不會提供自主選擇。','完全替學生決定會減少自主感。','強調外在價值不等於提供自主性。'],key:'自主需求：提供有意義的選擇，並支持學生承擔責任。'},
{id:'learning-advance',ref:'學生考古題｜學習輔導選擇題',chapter:5,topic:'學習輔導',icon:'⚖️',q:'教師先用學生熟悉的蹺蹺板說明槓桿概念，再進入抽象理論，較接近哪種教學策略？',opts:['前導組織因子','反應代價','系統減敏感','角色扮演'],a:0,ex:'先提供較一般、熟悉的架構，幫助學生理解接下來的新教材，符合前導組織因子的概念。',why:['正確。先用熟悉概念作為新學習的認知架構。','反應代價屬行為改變技術。','系統減敏感處理焦慮。','題幹未安排角色扮演活動。'],key:'新教材前先提供熟悉、較一般的概念架構＝前導組織因子。'},
{id:'career-elementary',ref:'學生考古題｜生涯輔導選擇題',chapter:6,topic:'生涯輔導',icon:'🌈',q:'國小階段的生涯輔導，較重要的著眼點為何？',opts:['生涯覺察與正確職業觀念','立即確定終身職業','只訓練求職面試','只分析薪資與升遷'],a:0,ex:'講義與考古題指出國小階段重在生涯覺察、探索及建立正確職業觀念，符合兒童發展階段。',why:['正確。國小重點是覺察、探索與職業觀念。','要求兒童立即決定終身職業不符合發展性探索。','求職面試訓練並非此階段的主要目標。','薪資升遷分析不是國小生涯輔導的核心。'],key:'國小生涯輔導：覺察、探索、認識職業。'},
{id:'career-super',ref:'學生考古題｜Super（舒伯）生涯發展',chapter:6,topic:'生涯輔導',icon:'🪜',q:'依考古題所採 Super（舒伯）階段，青少年嘗試不同職業選項、探索興趣與能力，屬於哪個階段？',opts:['探索階段','成長階段','維持階段','衰退階段'],a:0,ex:'探索階段的任務包含了解自我與職業世界，進行嘗試及選擇。考古題亦以青少年打工探索作為例子。',why:['正確。嘗試與探索職業選項符合探索階段。','成長階段重在自我概念與基本職業觀念發展。','維持階段重在維持既有職業位置。','衰退階段涉及工作投入逐漸減少或退休過渡。'],key:'Super（舒伯）：成長→探索→建立→維持→衰退。'},
{id:'career-gottfredson',ref:'學生考古題｜Gottfredson（葛佛森）生涯發展',chapter:6,topic:'生涯輔導',icon:'🌈',q:'Gottfredson（葛佛森）理論中，兒童約 6–8 歲開始依性別角色觀念理解職業，題庫稱為哪一階段？',opts:['性別角色導向','內在自我導向','大小與力量導向','社會價值導向'],a:0,ex:'考古題將約 6–8 歲、依性別角色觀念形成職業印象，對應性別角色導向。',why:['正確。與題幹年齡及性別角色線索相符。','內在自我導向較晚，重視興趣等個人因素。','大小與力量導向為較早期兒童依成人／兒童大小區分職業。','社會價值導向著重職業的社會地位。'],key:'依課堂考古題記：Gottfredson（葛佛森）約 6–8 歲性別角色導向。'},
{id:'data-validity',ref:'學生考古題｜學生資料與測驗',chapter:7,topic:'學生資料與測驗',icon:'📋',q:'測驗實際測到其原先預定測量特性的程度，稱為什麼？',opts:['效度','信度','常模','標準差'],a:0,ex:'效度關心測驗是否測到預定的特性或內容。',why:['正確。測驗是否測到原本要測的構念／特性。','信度關心測量結果的一致性或穩定性。','常模提供分數比較參照。','標準差描述分數離散程度。'],key:'效度＝測對；信度＝測量一致／穩定。'},
{id:'data-aptitude',ref:'學生考古題｜學生資料與測驗',chapter:7,topic:'學生資料與測驗',icon:'🧩',q:'要了解學生尚未充分發展、未來可能學習或勝任某項工作的潛能，較適合哪一類測驗？',opts:['性向測驗','成就測驗','人格測驗','興趣量表'],a:0,ex:'性向測驗用來評估個人未來學習或從事某類活動的潛在能力。',why:['正確。性向著重潛能或未來學習／表現可能性。','成就測驗衡量已學會的知識技能。','人格測驗評估較持續的特質或傾向。','興趣量表了解偏好，不等於潛在能力。'],key:'性向看潛能；成就看已學會；興趣看喜好。'},
{id:'data-psychometric',ref:'學生考古題｜學生資料與測驗',chapter:7,topic:'學生資料與測驗',icon:'📊',q:'利用標準化測驗、量表與分數資料進行評估，較屬於哪一種評量取向？',opts:['心理計量取向','純粹觀察取向','敘事取向','生態取向'],a:0,ex:'考古題以智力測驗等標準化工具對應心理計量取向。',why:['正確。標準化測驗及量化分數是心理計量取向常見方法。','觀察可蒐集行為資料，但題目明指標準化測驗。','敘事取向重視個人故事與意義建構。','生態取向關注個人與環境脈絡互動。'],key:'標準化測驗與量化分數 → 心理計量取向。'},
{id:'counsel-empathy',ref:'教師考古題｜同理技巧',chapter:8,topic:'個別輔導技巧',icon:'💛',q:'學生說「我考差了，覺得大家一定都認為我很笨。」哪句回應最能先傳達同理？',opts:['你就是太不用功了。','考差讓你很挫折，也擔心別人怎麼看你。','你不應該這麼在意。','你要保證下次考前三名。'],a:1,ex:'同理回應嘗試準確理解並傳達當事人的情緒與意義，而非急著責備、否定或下指令。',why:['責備學生，未反映其感受。','正確。反映挫折及對他人評價的擔心。','否定感受，容易讓學生覺得不被理解。','提出不切實際承諾與要求，沒有先理解學生。'],key:'同理：理解對方的內在感受與觀點，並以回應讓對方感受到被理解。'},
{id:'counsel-reflection',ref:'教師考古題｜諮商技巧',chapter:8,topic:'個別輔導技巧',icon:'🪞',q:'學生說「我每天都很煩」，老師問「你說的很煩，最常在什麼時候發生？」主要是什麼技巧？',opts:['澄清','面質','空椅','反應代價'],a:0,ex:'對模糊語句追問情境與意思，幫助雙方更清楚了解，是澄清。',why:['正確。針對「很煩」的模糊描述詢問具體情境。','面質是指出言行、感受或陳述間的不一致。','空椅是完形治療的經驗技巧。','反應代價是行為改變中的移除增強物。'],key:'澄清：針對模糊處提問，確認當事人的意思。'},
{id:'counsel-behavior',ref:'學生考古題｜個別諮商學派',chapter:8,topic:'個別輔導理論',icon:'🔎',q:'某學派將目標寫成「每節課在教師提示後舉手發言至少一次」，並追蹤可觀察的行為變化。較符合哪一取向？',opts:['行為治療','心理分析','個人中心','完形治療'],a:0,ex:'行為治療常以具體、可觀察、可測量的問題行為設定目標，並透過明確步驟改變行為。',why:['正確。目標具體、可觀察且可追蹤。','心理分析較重視無意識、早期經驗及心理動力。','個人中心重視關係條件及個案自我探索。','完形治療著重當下覺察與經驗。'],key:'具體、可觀察、可測量的行為目標 → 行為治療。'},
{id:'counsel-systematic',ref:'學生考古題｜個別諮商技巧',chapter:8,topic:'個別輔導理論',icon:'🫧',q:'學生害怕上臺，教師協助列出由低到高的焦慮情境，先練放鬆，再逐步接觸情境，為何種方法？',opts:['系統減敏感法','空椅技巧','反應代價','自由聯想'],a:0,ex:'系統減敏感法結合焦慮階層、放鬆訓練與逐步接觸。',why:['正確。低到高焦慮階層並搭配放鬆，是典型線索。','空椅是完形治療的情緒表達技術。','反應代價是移除增強物以降低行為。','自由聯想常見於心理分析取向。'],key:'焦慮階層＋放鬆＋逐步接觸＝系統減敏感。'},
{id:'counsel-rebt',ref:'學生考古題｜REBT',chapter:8,topic:'個別輔導理論',icon:'🧠',q:'學生認為「一次考不好就代表我整個人很沒用」。REBT 輔導者最適合做什麼？',opts:['協助辨認並辯駁「考不好＝沒用」的非理性信念','告訴學生不要想太多','要求學生回憶所有童年事件','只提供獎品鼓勵下次考高分'],a:0,ex:'REBT 強調事件本身不是情緒困擾的唯一原因，信念會影響結果；可辨識並辯駁絕對化、過度概括的信念。',why:['正確。找出非理性信念並用提問、證據與替代想法辯駁。','否定與簡化感受，沒有檢視信念。','回溯童年事件較不是本題所考 REBT 的核心做法。','外在獎勵沒有處理「一次失敗代表整個人無價值」的信念。'],key:'REBT：A 誘發事件、B 信念、C 情緒／行為結果；D 辯駁，形成新信念與效果。'},
{id:'counsel-gestalt',ref:'學生考古題｜完形治療',chapter:8,topic:'個別輔導理論',icon:'🪑',q:'老師請學生想像媽媽坐在對面椅子上，說出一直未表達的憤怒，使用哪種技術？',opts:['空椅技巧','系統減敏感','自我監控','前導組織因子'],a:0,ex:'空椅技巧讓當事人想像重要他人在場，直接表達未說出口的想法或感受，是完形治療常見技巧。',why:['正確。想像對方在空椅上並直接表達情緒。','系統減敏感處理焦慮階層，並搭配放鬆。','自我監控是記錄與觀察自身行為。','前導組織因子是協助理解新教材的教學策略。'],key:'完形空椅：對想像中的重要他人表達未竟情緒。'},
{id:'counsel-here-now',ref:'學生考古題｜完形治療',chapter:8,topic:'個別輔導理論',icon:'🌿',q:'老師注意學生上臺時握緊拳頭，問「你現在握拳時有什麼感覺？」較符合哪一學派？',opts:['完形治療','心理分析','現實治療','理情行為治療'],a:0,ex:'完形治療重視當下（此時此刻）經驗與覺察，包括身體感受、情緒與行為。',why:['正確。問題聚焦當下身體反應與感覺覺察。','心理分析通常探討無意識與早期經驗等心理動力。','現實治療重視當前選擇與行為、需求及計畫。','REBT 會檢視事件、信念及情緒／行為後果。'],key:'完形：此時此刻的覺察，留意身體、情緒與行為。'},
{id:'counsel-personcentered',ref:'教師考古題｜個人中心取向',chapter:8,topic:'個別輔導理論',icon:'🌷',q:'學生說自己不知未來想做什麼。教師回應「我注意到你很認真思考，也想知道你希望我怎麼陪你整理？」較符合哪個取向？',opts:['個人中心取向','行為治療','心理分析','反應代價'],a:0,ex:'回應接納學生的內在歷程，肯定其努力並尊重其需求與選擇，符合個人中心取向。',why:['正確。以接納、理解和尊重學生自主探索為主。','行為治療通常聚焦具體可觀察行為與改變步驟。','心理分析常探討無意識衝突或早期經驗。','反應代價是行為技術，不是諮商取向。'],key:'個人中心：同理、真誠、無條件積極關懷，支持當事人自我探索。'},
{id:'counsel-overgeneralize',ref:'學生考古題｜認知扭曲',chapter:8,topic:'個別輔導理論',icon:'🧠',q:'一位學生只因一位同學丟了他的文具，就認為「全班都聯合起來欺負我」，最接近哪種認知扭曲？',opts:['過度類化','個人化','二分化思考','正向否定'],a:0,ex:'從單一事件推廣到所有人、所有情況，是過度類化。',why:['正確。將一次或少數經驗擴大到普遍情況。','個人化是把外在事件過度歸因於自己。','二分化思考是以全有全無、非黑即白方式看事情。','正向否定是忽略或否定正向經驗。'],key:'由一次推論成「全部／每次」＝過度類化。'},
{id:'behavior-overcorrection',ref:'學生考古題｜行為認知治療',chapter:8,topic:'個別輔導理論',icon:'🧹',q:'學生弄髒自己的座位，教師要求他清理座位，並進一步打掃整間教室，屬於哪種方法？',opts:['過度矯正','負增強','反應代價','消弱'],a:0,ex:'除恢復原狀外，還要求超過原本需要的矯正行為，因此是過度矯正。',why:['正確。要求超過原行為所需的額外矯正。','負增強是移除不愉快刺激以增加行為。','反應代價是失去既有增強物。','消弱是停止提供維持行為的增強。'],key:'過度矯正：修復原狀之外，要求額外矯正行為。'},
{id:'behavior-reinforcement',ref:'學生考古題｜行為認知治療',chapter:8,topic:'個別輔導理論',icon:'🔁',q:'要教會學生一個尚未建立的新行為，之後再維持已穩定的行為，較適當的增強順序為何？',opts:['先持續增強，穩定後改間歇增強','先間歇增強，穩定後改持續增強','一開始完全不增強','只在行為消失後增強'],a:0,ex:'新行為建立初期持續增強有助形成行為與增強的連結；穩定後改為間歇增強有利維持。',why:['正確。由持續增強建立，再以間歇增強維持。','順序相反，間歇增強不利新行為初始建立。','完全不增強不能提供新行為建立所需回饋。','行為消失後才增強無助於建立與維持目標行為。'],key:'新行為先持續增強；穩定後間歇增強。'},
{id:'behavior-function',ref:'學生考古題｜行為功能分析',chapter:8,topic:'個別輔導理論',icon:'🔎',q:'學生在課堂搗蛋後得到同學大笑和注意。教師做行為功能分析時，這些同學反應屬於哪一部分？',opts:['後果（C）','前事（A）','目標行為（B）','替代信念（D）'],a:0,ex:'ABC 行為功能分析中，A 是行為前事、B 是行為、C 是行為後果。取得同儕注意是行為之後的結果與可能功能。',why:['正確。同儕大笑與注意發生在行為之後，是後果。','前事是行為發生前的情境或事件。','目標行為是可觀察的搗蛋行為本身。','替代信念屬認知治療概念，不是此行為分析欄位。'],key:'行為 ABC：A 前事、B 行為、C 後果；再推估功能。'}
];

const bookRows=[
['b01',1,'輔導基本概念','依課本與課堂投影片，輔導服務的對象主要是？',['全體學生及有需要的個人','只有診斷為心理疾病者','只有成績落後者','只有主動求助者'],0,'學校輔導兼具發展、介入與處遇層次，服務不只限於已有診斷或主動求助者。',['服務對象不以問題或診斷作唯一限制。','這把輔導限縮成臨床治療。','成績落後只是可能需求之一。','低年級或被動學生也可能需要輔導。'],'輔導服務面向全體學生，依需求提供不同層次協助。'],
['b02',1,'輔導基本概念','「輔人自導」最能表達哪個輔導精神？',['由輔導者替當事人決定答案','協助當事人了解自己並發展自主選擇能力','以測驗分數決定當事人適合的生活','避免當事人自行探索'],1,'輔導者提供專業協助與支持，目標是促進當事人的自我了解、選擇與發展，而非取代其決定。',['代替選擇會削弱自主性。','正確。專業協助是為促進當事人自我引導與發展。','測驗只是可能的資料來源，不足以決定人生。','自主探索是輔導的重要歷程。'],'輔導者助人自助，支持當事人自我引導。'],
['b03',1,'三級輔導','教師面向全班進行情緒辨識與人際教育，主要屬於哪個層次？',['發展性輔導','介入性輔導','處遇性輔導','個別心理治療'],0,'普及性的課程與活動面向一般學生，促進能力並預防困難，屬發展性輔導。',['正確。全班性的發展促進活動屬發展性輔導。','介入性輔導多針對已呈現需求的學生。','處遇性輔導回應較嚴重或複雜需求。','題目是全班教育活動，不是個別心理治療。'],'普及、促進與預防 → 發展性輔導。'],
['b04',1,'輔導基本概念','當學生需求超出導師能力範圍時，較適當的專業作法是？',['保密到底，不讓任何專業人員知道','依程序與學生／家長合作，尋求校內外適切資源或轉介','自行診斷並承諾治療','在班上公開個案細節尋求同學意見'],1,'教師應在自身專業能力範圍內提供支持；需要更專業服務時依流程協調資源與轉介，並注意保密。',['保密不應成為阻止必要專業協助的理由。','正確。合作與適切轉介兼顧學生需要及專業界線。','教師不宜超越專業角色自行診斷或承諾治療。','公開個案細節侵犯隱私。'],'覺察專業界線，合作、諮詢或轉介。'],
['b05',1,'輔導倫理','輔導紀錄最適當的處理原則為何？',['只要是教師就可自由閱讀','妥善保管並依職責、需要及規範限制接觸','放在公開雲端方便協作','為避免誤會，完全不作紀錄'],1,'學生資料與輔導紀錄應妥善保管，僅讓因職務需要且有適當權限者接觸，並注意保密與用途。',['職稱本身不代表可任意調閱。','正確。應限制存取與維護隱私。','公開雲端增加未授權存取風險。','是否紀錄應依專業需要與規範，而非一概不記。'],'紀錄有目的、限權限、妥善保管。'],
['b06',1,'輔導基本概念','下列何者最符合輔導工作與心理測驗的關係？',['測驗分數可單獨決定個案未來','測驗可作為理解個人的一項資料，需結合其他資訊審慎解釋','只要施測就能找出唯一原因','測驗完全不能用於輔導'],1,'測驗是蒐集資料的工具之一，解釋時須考量測驗品質、情境與其他資料，不能以分數取代完整理解。',['分數不能單獨決定未來。','正確。需結合晤談、觀察等資料理解。','測驗通常不能單獨確定唯一成因。','測驗可在適當目的與專業條件下作為資料來源。'],'測驗是資料之一，不是對人的完整描述。'],
['b07',2,'輔導發展歷史','依第二章講義，最早有系統將輔導帶入學校課程的人物是？',['Jesse B. Davis（戴維斯）','Truman L. Kelly（凱利）','Carl Rogers（羅吉斯）','B. F. Skinner（史金納）'],0,'第二章講義指出 Davis（戴維斯）於 1909 年有系統將輔導帶入學校課程。',['正確。講義記載 Davis（戴維斯）與 1909 年學校課程的輔導推動。','Kelly（凱利）被記為 1941 年首倡教育輔導。','Rogers（羅吉斯）是人本與個人中心取向代表人物。','Skinner（史金納）是行為學派重要人物，並非本題史實。'],'Davis（戴維斯）：1909 年系統化將輔導帶入學校課程。'],
['b08',2,'輔導發展歷史','第二章講義中，Truman L. Kelly（凱利）對教育輔導的歷史貢獻是？',['1941 年首倡教育輔導','創立心理分析論','創立完形心理學','提出生涯彩虹圖'],0,'講義記載 Kelly（凱利）於 1941 年首倡教育輔導，著眼於協助學生適應學校生活與選擇課程。',['正確。講義對應 Kelly（凱利）與 1941 年教育輔導。','心理分析論由 Freud（佛洛伊德）創立。','完形心理學由 Wertheimer（魏泰邁）等人推動。','生涯彩虹圖與 Super（舒伯）有關。'],'Kelly（凱利）：教育輔導，1941 年。'],
['b09',2,'輔導發展歷史','第二章講義所列 1879 年的重要心理學事件是？',['馮德建立實驗心理學實驗室','羅吉斯提出個人中心治療','華生創立行為學派','Davis（戴維斯）將輔導帶入學校課程'],0,'講義年表將 1879 年與馮德及實驗心理學的建立相連。',['正確。1879 年對應馮德及實驗心理學。','羅吉斯的人本／個人中心發展較晚。','華生行為主義常以 1913 年為代表年份。','Davis（戴維斯）對應 1909 年。'],'1879：馮德與實驗心理學。'],
['b10',2,'輔導發展歷史','依第二章講義，華生行為學派強調心理學研究何者？',['可客觀觀察與測量的外顯行為','夢的象徵意義','個人自由選擇的生涯目標','未被覺察的內在衝突'],0,'講義指出華生主張心理學研究客觀觀察與測量的外顯行為。',['正確。這是行為學派的客觀行為取向。','夢的解析更接近心理分析。','自主生涯選擇不是華生學派的核心研究主張。','未覺察衝突是心理分析的關注。'],'行為學派強調可觀察、可測量的行為。'],
['b11',2,'輔導發展歷史','第二章講義所述 1950 年人本心理學的重要主張為何？',['人性善良且具有發展潛能','行為只能由外在刺激決定','人格完全由無意識衝突決定','測驗可以完整代表人格'],0,'講義指出 Maslow（馬斯洛）與 Rogers（羅吉斯）提倡人本心理學，強調人性善良及人的潛能。',['正確。符合講義對人本心理學的描述。','這種說法過度簡化行為取向，也不是人本主張。','這是心理分析式的決定論表述，非人本觀點。','講義沒有主張測驗完整代表人格。'],'人本心理學強調人的價值、善性與潛能。'],
['b12',2,'輔導發展歷史','第二章講義將我國輔導工作的哪個發展階段，描述為開始由團體推展觀念、訓練人員並建立制度？',['開拓時期','萌芽時期','專業效能提升時期','理論躍進時期'],0,'講義將中國輔導學會自民國 47 年起推展觀念、訓練人員與制度，列在開拓時期。',['正確。對應講義所述開拓時期。','萌芽時期是更早的發展起點。','專業效能提升時期是之後的發展階段。','理論躍進期是美國輔導發展分期，不是我國此階段名稱。'],'我國發展分期依講義：萌芽、開拓、制度建立、專業效能提升。'],
['b13',3,'輔導組織與方案','學校輔導若透過教師、家長與社區資源共同支持學生，呈現何種工作特性？',['跨系統合作','只由輔導室獨立負責','避免與家庭聯繫','只依學生分數安排'],0,'學校輔導需連結校內教師、家庭與社區資源，依學生需求形成合作網絡。',['正確。整合不同系統資源有助支持學生。','把工作限縮給單一單位不符合合作性。','家庭可成為合作夥伴，除非情境另有安全考量。','分數只是可能資訊之一，不能取代多方理解。'],'輔導是校內外合作的系統工作。'],
['b14',3,'輔導組織與方案','規劃學校輔導方案時，最先要掌握什麼？',['學生需求與學校情境','先買大量測驗工具','先安排活動再決定目標','只參考其他學校形式不評估本校'],0,'方案需以學生需求與學校情境作為規劃依據，之後訂目標、策略與評估方式。',['正確。需求評估是方案規劃的重要起點。','工具應依目的選擇，不能先買再找用途。','活動應服務清楚目標。','外校經驗可參考，但須依本校需要調整。'],'需求評估 → 目標 → 策略 → 實施與評估。'],
['b15',3,'輔導組織與方案','教師在班級中進行全班性預防教育，與輔導室合作個別追蹤有需求學生，最能說明何者？',['輔導工作需要全校參與並依需求分工','導師不能參與輔導','所有學生都應接受個別治療','輔導室不需要與教師合作'],0,'班級發展性工作可由教師實施；個別需求可與輔導專業人員合作，體現全校參與及分工。',['正確。輔導需全校參與並按專業協作。','導師是學生支持系統的一部分。','個別治療並不適用所有學生。','合作可讓支持更連續。'],'普及性班級輔導與專業個別服務相互配合。'],
['b16',3,'輔導組織與方案','輔導方案評估的主要目的為何？',['檢視目標是否達成，作為修正方案的依據','只為增加行政表格','找出需要責備的學生','活動結束後便不再追蹤'],0,'評估可了解方案實施情形與成效，作為調整服務的依據。',['正確。評估服務於改進方案及檢視目標。','行政紀錄可能是流程之一，但不是主要目的。','方案評估不是用來責備個別學生。','追蹤和回饋能協助後續改善。'],'評估是為了解成效並持續改進。'],
['b17',3,'輔導組織與方案','提供教師如何支持特定學生的建議，並由教師在日常教學中實施，較接近哪種服務？',['諮詢','個別心理治療','心理測驗','生涯抉擇'],0,'諮詢通常是專業人員與教師、家長等合作，協助其更有效支持學生。',['正確。透過合作對教師提供策略是諮詢。','題目未描述直接治療學生。','沒有施測或測驗解釋。','沒有職涯選擇議題。'],'諮詢的服務對象常是能協助個案的成人或系統。'],
['b18',4,'生活輔導','新生進入陌生校園時，定向服務最應協助他？',['認識環境、作息、規範及求助資源','立即選定未來職業','完成心理疾病診斷','背誦所有校規條文'],0,'定向服務協助新生適應環境並知道如何求助，重點是熟悉而非背誦或診斷。',['正確。環境、作息、規範與資源是其核心。','職業選擇不是入學定向的主要內容。','定向服務不等於心理診斷。','理解並能使用規範比單純背誦更切合目的。'],'定向服務重在熟悉新環境與建立安全感。'],
['b19',4,'生活輔導','學生打翻水杯後，教師請他擦乾地板並向受影響同學道歉，主要運用？',['邏輯後果','反應代價','隔離','饜足'],0,'清理與道歉皆和打翻水的行為有關，著重補救與負責，是邏輯後果。',['正確。後果與行為有直接合理連結。','反應代價是失去增強物。','隔離是暫時離開增強情境。','饜足不是此種相關補救處理。'],'讓學生修復行為造成的影響。'],
['b20',4,'生活輔導','教師說「你很自私，從來不顧別人」，最主要的問題是？',['以人格標籤和概括批評取代具體行為回饋','使用我訊息','提供邏輯後果','描述客觀行為'],0,'人格標籤與「從來」等概括語容易引發防衛，沒有清楚指出可改變的具體行為。',['正確。應改為描述具體行為及影響。','我訊息會說明自己的感受、影響與請求。','沒有提出與行為相關的修復結果。','這句是評價人格，不是客觀描述行為。'],'回饋聚焦具體行為，避免貼標籤。'],
['b21',4,'生活輔導','學生在家能自在說話，在學校長期不開口；教師第一步較適合？',['理解情境並與家長、輔導專業人員合作評估','當眾要求他立刻回答','直接認定學生故意不合作','只以懲罰促使開口'],0,'考古題以跨情境差異作選擇性緘默線索；實務上需進一步評估與合作，不可只憑題幹診斷。',['正確。先了解情境並取得適當評估與支持。','公開逼答可能增加焦慮。','不能由單一描述推定故意。','懲罰可能增加壓力，並未處理困難。'],'觀察跨情境表現，先理解、支持並評估。'],
['b22',4,'生活輔導','若學生的行為目的是吸引同儕注意，教師的教導重點較適合是？',['教他用舉手、適當發言等方式取得注意','完全不再與學生互動','只增加責罵次數','取消所有課堂參與機會'],0,'先分析行為功能，再教導可達成相同功能的合宜替代行為，並在替代行為出現時給予回應。',['正確。替代行為要能適當滿足注意需求。','完全不互動可能忽略學生其他需要。','責罵也可能成為注意而維持行為。','排除參與機會不會教會適當表達。'],'辨識行為功能，教可替代的適當行為。'],
['b23',4,'生活輔導','學生因課業表現不佳而缺乏自信，也不敢表達需要；何種訓練較直接？',['自我肯定訓練','反應代價','時間隔離','過度矯正'],0,'自我肯定訓練練習適當表達想法與需求，有助於自我概念及人際互動。',['正確。符合表達與自我肯定的需要。','反應代價不直接教導表達能力。','隔離不會建立表達技巧。','過度矯正是處理行為後果的技術。'],'教表達與肯定，不只壓制行為。'],
['b24',4,'生活輔導','學生因錯誤行為受到同儕注意後，行為反而增加。這提醒教師分析哪一項？',['行為後果是否具有增強作用','學生的生涯類型','測驗常模','記憶策略'],0,'行為是否持續，常受其後果影響；同儕注意可能成為增強物。',['正確。需觀察行為後果與功能。','生涯類型與行為增強無直接關係。','常模是測驗比較資料。','記憶策略與此行為歷程不相干。'],'分析行為前事、行為、後果與功能。'],
['b25',4,'生活輔導','全班性人際互動與情緒教育，通常最符合哪種輔導取向？',['發展性與預防性','處遇性治療','診斷性測驗','只限危機個案'],0,'班級普及活動促進能力並預防問題，屬發展與預防取向。',['正確。面向全班的能力培養是普及性服務。','處遇性服務不是一般全班教育。','活動本身並非診斷施測。','危機個案是較高強度服務，不是唯一對象。'],'普及教育重發展與預防。'],
['b26',5,'學習輔導','課本講義所述學習輔導的主要目的為何？',['協助學生有效學習、獲得成就並促進發展','只負責補考或懲罰','替學生完成作業','只挑選高成就學生'],0,'學習輔導運用心理與教育方法協助有效學習、提高成就並促進發展。',['正確。符合講義定義與目的。','學習輔導不等同補考或懲罰。','代做作業無法培養學習能力。','學習輔導可依需求協助不同學生。'],'學習輔導促進有效學習、成就、習慣與潛能。'],
['b27',5,'學習輔導','依講義，國小學習輔導的重要內容不包括哪一項？',['協助培養學習興趣、動機與良好習慣','發展學習能力與有效方法','建立正確學習觀念與態度','要求所有兒童採用完全相同的讀書方法'],3,'講義列出興趣動機、學習觀念與態度、能力、習慣與方法、學習環境等；策略應適切而非一律相同。',['這是國小學習輔導內容。','這也是講義列出的重點。','這也是講義列出的重點。','正確。應依學生差異與學習需求選擇策略。'],'學習輔導需適性，不是一套方法適用所有人。'],
['b28',5,'學習策略','把教材先看整體脈絡，一氣連貫地學習，較接近哪種方法？',['整體學習法','部分學習法','反應代價','系統減敏感'],0,'整體學習法強調把材料作為整體連貫學習；部分學習則分段進行。',['正確。題幹描述整體連貫。','部分學習是分段練習。','反應代價是行為改變策略。','系統減敏感處理焦慮。'],'整體法連貫學；部分法分段學。'],
['b29',5,'學習策略','學生已能正確回憶教材後，仍增加一些練習以強化記憶，稱為？',['過度學習','前導組織','負增強','精緻化'],0,'達到熟練後繼續練習，稱過度學習，可強化保持。',['正確。已學會後繼續練習。','前導組織是新教材前的認知架構。','負增強是移除不愉快刺激以增加行為。','精緻化是增加聯想與意義連結。'],'熟練後再練習 → 過度學習。'],
['b30',5,'學習策略','學生先快速瀏覽章節，再提出問題，之後閱讀、背誦並複習，使用哪種方法？',['SQ3R（瀏覽、提問、閱讀、背誦、複習）','PQRST（預覽、提問、閱讀、自述、測驗）','MURDER（準備、理解、回憶、檢查、推敲、複習）','VAKT（視覺、聽覺、動覺、觸覺）'],0,'SQ3R 五步驟：S（Survey，瀏覽）、Q（Question，提問）、R（Read，閱讀）、R（Recite，背誦／自述）、R（Review，複習）。',['正確。步驟與題幹一致。','PQRST 中 S（State，自述）與 T（Test，測驗）分別代表自述和測驗；本題所問的 Q 則是提問。','MURDER 各步驟依序是準備、理解、回憶、檢查、推敲、複習。','VAKT 是多重感官訓練。'],'SQ3R：瀏覽、提問、閱讀、背誦、複習。'],
['b31',5,'學習策略','教師教單字時讓學生看字、聽讀音並實際觸寫，對應講義哪項策略？',['VAKT 多重感官訓練：V（Visual，視覺）、A（Auditory，聽覺）、K（Kinesthetic，動覺）、T（Tactile，觸覺）','只用複誦','觀察法','生涯探索'],0,'VAKT：V（Visual，視覺）、A（Auditory，聽覺）、K（Kinesthetic，動覺／運動覺）、T（Tactile，觸覺），透過多感官學習。',['正確。題幹結合視覺、聽覺、動覺與觸覺。','複誦只是重複練習，不能涵蓋所有感官。','觀察法是搜集學生資料方法。','生涯探索與單字教學方法無關。'],'VAKT：V（Visual，視覺）、A（Auditory，聽覺）、K（Kinesthetic，動覺／運動覺）、T（Tactile，觸覺）。'],
['b32',5,'學習策略','將大量要記的項目依類別整理，再從類別提取，主要是？',['組織化記憶策略','位置記憶法','諧音法','心象法'],0,'組織化將零散資訊分類、排序或建立層次，便於記憶和提取。',['正確。依類別整理是組織化。','位置法把資訊與熟悉空間位置連結。','諧音法利用相似音聯想。','心象法運用心理圖像與聯想。'],'分類整理 → 組織化。'],
['b33',5,'學習策略','學生用諧音把一串數字轉成容易記的短句，運用何種方法？',['諧音法','位置記憶法','整體學習法','後設認知'],0,'以音調相似的詞句代替抽象資訊，是講義所述諧音法。',['正確。利用聲音相似建立記憶線索。','位置法使用空間位置做線索。','整體法是學習材料的組織方式。','後設認知是對學習歷程的計畫、監控與評估。'],'音相似作聯想 → 諧音法。'],
['b34',5,'學習策略','學生把剛讀過的章節合上書，試著回想重點，再回頭確認不熟處，運用？',['嘗試回憶法','心象記憶法','自然後果','反應代價'],0,'講義建議閱讀後嘗試回憶，以檢查記憶並找出不熟部分。',['正確。先自行回想再檢查。','心象法以心理圖像和聯想協助記憶。','自然後果與學習回憶無關。','反應代價是行為改變技術。'],'讀後先回想，再檢查不足。'],
['b35',5,'學習策略','後設認知中的「監控」最可能是哪一行為？',['閱讀中停下檢查自己是否理解','讀完後只整理課本重點','由教師替學生決定學習目標','把錯題抄十遍'],0,'監控是學習過程中檢查進度、理解或策略是否有效。',['正確。學習中檢查理解即監控。','整理內容可以是認知策略，未必是監控。','教師代替學習者決定，不是學生自我監控。','抄寫不必然包含理解監控。'],'計畫前、監控中、評估後。'],
['b36',5,'學習策略','教師讓同儕以遊戲、討論與共同創作互相學習，主要運用？',['同儕互動資源','心理計量','反應代價','獨自精熟'],0,'講義指出同儕互動能支持學習成就與社會互動，可透過遊戲、討論、創作等進行。',['正確。題幹直接使用同儕合作。','心理計量是測驗評估取向。','反應代價是行為技術。','題幹是合作互動而非獨自練習。'],'同儕互動可同時支持學習與社會能力。'],
['b37',6,'生涯輔導','課本講義中的生涯概念，較適合描述為？',['一生中工作、職位及相關生活角色的發展歷程','只指目前的職稱','只指受薪工作，不含其他生活角色','一次選定後不再改變的職業'],0,'講義引用 Super（舒伯）等人的廣義生涯觀，包含一生職位、工作與生活角色的歷程。',['正確。生涯是跨生命歷程的多角色發展。','生涯不只是當下職稱。','講義列出休閒、家庭、公民等生活角色的觀點。','生涯會隨發展與選擇改變，不是一次決定。'],'生涯是終身發展歷程，涵蓋多種生活角色。'],
['b38',6,'生涯輔導','依講義，國小階段生涯輔導最適切的方向是？',['認識職業與生涯覺察','以求職面試為核心','要求確定終身職業','只教授職業薪資比較'],0,'講義指出國小生涯輔導重職業觀念與生涯覺察，符合兒童發展。',['正確。國小著重覺察與職業認識。','面試技巧不是國小主要任務。','過早要求終身決定不符合探索發展。','薪資比較不是主要核心。'],'國小生涯輔導以覺察和職業認識為重。'],
['b39',6,'生涯輔導','學生比較自己的興趣、能力與職業資訊，整理後再做選擇，屬於生涯歷程中的？',['知己、知彼與抉擇準備','反應代價','人格診斷','消弱'],0,'講義的生涯要素模式先認識自己與環境，再進行抉擇，接續訂定目標和行動。',['正確。先知己知彼再作抉擇。','反應代價是行為改變方法。','單純職業探索不等於人格診斷。','消弱是行為技術。'],'知己知彼 → 抉擇 → 目標與行動。'],
['b40',6,'生涯輔導','生涯抉擇的較適切理解是？',['一生中可能反覆發生，前後選擇會形成生涯路徑','只在畢業時作一次決定','每次選擇都與過去無關','決策結果完全由他人負責'],0,'考古題指出生涯抉擇會在人生中不斷發生，選擇彼此相關並形成路徑；個人也需參與承擔。',['正確。生涯決定具有連續性。','人生不同階段可能持續調整選擇。','先前經驗與選擇會影響後續路徑。','當事人仍是計畫實踐者與責任承擔者。'],'生涯是一連串選擇及其累積的路徑。'],
['b41',6,'生涯輔導','教師設計活動讓學生蒐集不同職業工作內容與環境資料，主要是在協助？',['職業探索','情緒反映','成就評量','過度矯正'],0,'蒐集職業世界資訊是生涯探索的一環，可支持知彼與後續決定。',['正確。了解工作內容及環境是職業探索。','情緒反映是諮商技巧。','成就評量衡量已學習的表現。','過度矯正是行為處理技術。'],'探索職業資訊，建立職業世界知識。'],
['b42',6,'生涯輔導','生涯輔導在協助個人形成獨特生活型態時，最鼓勵學生？',['為自己的生涯發展負責並作出適切選擇','完全依照家長期待選擇','忽略興趣與能力','把生涯決定交給測驗分數'],0,'講義指出生涯輔導協助個體建構獨特生活方式，並鼓勵對自身生涯發展負責。',['正確。自主負責是生涯發展的重要態度。','他人意見可參考，但不能完全取代個人探索。','了解興趣與能力是生涯覺察的重要部分。','測驗只能提供一項資料，不能代替決定。'],'認識自己、了解環境，並對生涯選擇負責。'],
['b43',6,'生涯輔導','霍蘭德興趣類型中，偏好有秩序、規則明確、文書處理的學生，較接近？',['事務型（C）','藝術型（A）','社會型（S）','企業型（E）'],0,'教師考古題將秩序、明確規則與文書特長對應事務型 C。',['正確。偏好組織、規則及文書事務。','藝術型重視創意、表達與非結構情境。','社會型偏好助人、教導與互動。','企業型偏好影響、說服、領導或經營。'],'霍蘭德 C 型常見線索：規則、秩序、資料與文書。'],
['b44',7,'學生資料蒐集','教師記錄學生在自然情境中實際出現的行為，較屬哪種資料蒐集方法？',['觀察法','成就測驗','生涯量表','投射測驗'],0,'觀察法透過直接留意並記錄行為，了解學生在情境中的表現。',['正確。自然情境行為紀錄是觀察資料。','成就測驗評估已學會的知識技能。','生涯量表了解職業興趣或相關發展。','投射測驗不是直接觀察行為紀錄工具。'],'觀察資料需有明確目的並作系統記錄。'],
['b45',7,'學生資料蒐集','觀察記錄工具包括項目檢核表、評定量表與軼事記錄；下列哪項不是觀察法記錄工具？',['社會計量表','項目檢核表','評定量表','軼事記錄法'],0,'教師考古題將社會計量表列為非觀察法記錄工具；它用來了解團體人際選擇關係。',['正確。社會計量表不是題中所列觀察記錄工具。','檢核表可依觀察項目記錄有無。','評定量表可記錄行為程度。','軼事記錄可記錄具體事件。'],'觀察法工具可用檢核表、評定量表、軼事記錄。'],
['b46',7,'學生資料蒐集','標準化測驗分數需要結合晤談或觀察等非正式資料，主要因為？',['單一測驗不能完整呈現學生，解釋需考慮脈絡','標準化測驗完全無參考價值','非正式資料永遠比測驗準確','常模可以消除所有文化差異'],0,'考古題強調測驗結果需輔以非正式評量資料，才能適切解釋並避免過度推論。',['正確。多元資料有助理解個人脈絡。','標準化測驗可提供有用資訊，但有限制。','不同資料各有用途，不能絕對排序。','常模不會消除所有文化或情境偏誤。'],'多元資料互補，避免以單一分數定義學生。'],
['b47',7,'學生資料蒐集','測驗高信度但效度不一定高，最能說明何者？',['測量穩定不代表測到的就是預定特性','信度和效度完全相同','效度只看測驗題數','只要有效度就不需考慮信度'],0,'信度是結果的一致性，效度是是否測到目標；穩定測錯東西仍可能缺乏效度。',['正確。信度是必要條件但不足以保證效度。','兩者概念不同。','題數不是效度的唯一標準。','信度仍是評估測驗品質的重要條件。'],'信度穩定，效度測對；高信度不保證高效度。'],
['b48',7,'學生資料蒐集','想預測學生接受特定訓練後的學習潛能，較適合使用？',['性向測驗','成就測驗','興趣測驗','人格測驗'],0,'考古題將學習潛能及對訓練的適合程度對應性向測驗。',['正確。性向測驗評估潛在學習能力。','成就測驗測量已學會的內容。','興趣測驗了解偏好，不直接測潛能。','人格測驗描述特質，不是本題目的。'],'性向看潛能；成就看已學成果。'],
['b49',7,'學生資料蒐集','學生在作答時同步說出自己正在想什麼，稱為？',['放聲思考','臨床晤談','靜態評量','實作評量'],0,'考古題把作答者口語說出當下思考過程稱為放聲思考。',['正確。將思考歷程口語化。','臨床晤談是透過會談蒐集資料。','靜態評量不是說出思考歷程的作法。','實作評量觀察完成任務的表現。'],'放聲思考可了解作答歷程與策略。'],
['b50',7,'學生資料蒐集','標準化智力測驗結果最適當的解釋方式是？',['結合其他正式與非正式資料及情境資訊','直接當作學生全部能力的結論','只看總分，不檢視施測條件','將結果公開供同學比較'],0,'測驗結果應結合其他資料、施測條件和專業判斷，避免將分數當作完整人格或能力描述。',['正確。多元資料與脈絡有助適切解釋。','單一測驗不能完全了解兒童。','施測條件可能影響結果。','公開測驗結果侵害隱私且可能造成標籤。'],'測驗結果需審慎解釋並維護隱私。'],
['b51',8,'個別諮商理論','精神分析取向較重視哪一項對人格與困擾的影響？',['潛意識歷程與早期經驗','單純增強次數','當下職業資訊','記憶分類方式'],0,'精神分析重視無意識心理歷程、早期經驗及內在衝突。',['正確。是精神分析理論核心關注。','增強次數是行為學習概念。','職業資訊屬生涯輔導內容。','分類記憶是學習策略。'],'精神分析著重無意識與早期經驗。'],
['b52',8,'個別諮商理論','自由聯想與夢的解析較常見於哪個取向？',['精神分析','行為治療','個人中心','生涯三角'],0,'第二章及第八章材料將自由聯想、夢的解析列為精神分析常用技術。',['正確。自由聯想與夢解析是精神分析常見技術。','行為治療重視行為觀察與改變程序。','個人中心重視同理、真誠與接納。','生涯三角是生涯理論模式。'],'自由聯想、夢解析 → 精神分析。'],
['b53',8,'個別諮商理論','阿德勒取向較重視哪個概念？',['社會興趣與追求優越的目標','只以生物本能解釋所有行為','外在增強塑造所有人格','測驗分數決定生涯'],0,'課堂比較資料指出阿德勒重視主觀目標、追求優越及社會興趣。',['正確。這些是個體心理學的重要概念。','這更像精神分析中強調本能驅力的表述。','外在增強的行為取向不能代表阿德勒核心。','測驗分數不是其理論主張。'],'阿德勒：目標導向、追求優越、社會興趣。'],
['b54',8,'個別諮商理論','個人中心取向中的無條件積極關懷，指的是？',['不以表現好壞作為接納與關懷的交換條件','同意學生所有行為','只在學生成功時稱讚','避免傾聽不同觀點'],0,'Rogers（羅吉斯）的無條件積極關懷是尊重與接納個人，不等於認同每個行為。',['正確。接納人本身，不把關懷當作獎品。','接納個人不等於允許或認同所有行為。','若只在成功時關懷就是條件式肯定。','同理理解需要聆聽當事人的觀點。'],'無條件接納個人，仍可對行為設立界線。'],
['b55',8,'個別諮商理論','Rogers（羅吉斯）所述良好助人關係的條件包括同理、真誠一致，以及？',['無條件積極關懷','空椅技巧','反應代價','夢的解析'],0,'個人中心取向重視同理、真誠一致與無條件積極關懷。',['正確。是 Rogers（羅吉斯）關係條件之一。','空椅是完形治療技巧。','反應代價屬行為改變技術。','夢解析常見於精神分析。'],'個人中心三條件：同理、真誠一致、無條件積極關懷。'],

];main.innerHTML=`<section class="view"><div class="eyebrow">WRITE & RECALL</div><h1 style="font-size:30px;margin:7px 0">簡答與申論練習</h1><p style="color:var(--muted);font-size:13px;line-height:1.7">先自己寫，再展開檢核要點。這裡不會自動評分，方便你用自己的話練習作答。</p>${prompts.map((p,i)=>`<article class="writing-card"><div class="writing-label">${p.type}</div><h3>${p.q}</h3><textarea aria-label="作答區 ${i+1}" placeholder="在這裡整理你的答案…"></textarea><button class="btn secondary reveal" data-id="key${i}" style="padding:9px 12px;font-size:11px;margin-top:8px">查看作答要點　＋</button><div class="answer-key" id="key${i}"><b>自我檢核</b><br>${p.key}</div></article>`).join('')}</section>`;main.querySelectorAll('.reveal').forEach(b=>b.onclick=()=>{const key=document.getElementById(b.dataset.id);key.classList.toggle('open');b.textContent=key.classList.contains('open')?'收起作答要點　−':'查看作答要點　＋'})}
function home(){page='home';setNav('#navHome');main.innerHTML=`<section class="view"><div class="hero"><div><div class="eyebrow">MIDTERM REVIEW · 2026</div><h1>期中複習，從這裡開始</h1><p>共 100 題選擇題，每回合隨機練習 10 題；也可練填充、名詞解釋與申論。每題附解析或參考擬答。</p><div class="actions"><button class="btn primary" id="startBtn">開始選擇題（10 題）</button><button class="btn secondary" id="fillBtn">填充題練習</button><button class="btn secondary" id="writeBtn">手寫題練習</button><button class="btn quiet" id="wrongBtn">查看錯題</button></div></div></div><div class="section-head"><h2>期中考資訊</h2><span>依你提供的範圍圖片</span></div><div class="exam-grid"><div class="exam-stat"><b>80 分鐘</b><span>13:40–15:00</span></div><div class="exam-stat"><b>25 題</b><span>選擇題</span></div><div class="exam-stat"><b>4 + 2 題</b><span>簡答／名詞解釋 + 申論</span></div></div><div class="section-head"><h2>課本複習範圍</h2><span>第 1–8 章，至第 241 頁</span></div><div class="chapter-grid"><div class="chapter"><b>第 1 章</b>　輔導之基本概念 · p.1</div><div class="chapter"><b>第 2 章</b>　輔導工作之發展歷史 · p.33</div><div class="chapter"><b>第 3 章</b>　輔導組織、人員與輔導方案 · p.51</div><div class="chapter"><b>第 4 章</b>　生活輔導 · p.79</div><div class="chapter"><b>第 5 章</b>　學習輔導 · p.113</div><div class="chapter"><b>第 6 章</b>　生涯輔導 · p.139</div><div class="chapter"><b>第 7 章</b>　學生資料的搜集與運用 · p.185</div><div class="chapter"><b>第 8 章</b>　個別輔導 · p.215–241</div></div><div class="source"><b>題庫與來源</b><br>100 題選擇題涵蓋第 1–8 章，並附逐選項解析；填充與手寫題附參考擬答。題目依考古題及可辨識的課本講義概念整理。</div></section>`;document.querySelector('#startBtn').onclick=start;document.querySelector('#writeBtn').onclick=writing;document.querySelector('#fillBtn').onclick=fillPractice;document.querySelector('#wrongBtn').onclick=review;refreshStats()}
function start(){page='quiz';index=0;score=0;locked=false;activeQuestions=[...allQuestions].sort(()=>Math.random()-.5).slice(0,10);refreshStats();setNav('#navQuiz');renderQuestion()}
function renderQuestion(){const q=activeQuestions[index];locked=false;main.innerHTML=`<section class="view"><div class="question-head"><span class="pill">${esc(q.topic)}</span><span class="qcount">第 ${index+1} / ${activeQuestions.length} 題</span></div><div class="progress" aria-label="答題進度"><i style="width:${(index+1)/activeQuestions.length*100}%"></i></div><h1 class="qtext">${esc(q.q)}</h1><div class="opts">${q.opts.map((o,j)=>`<button class="opt" data-choice="${j}"><span class="letter">${letters[j]}</span><span class="opttxt">${esc(o)}</span></button>`).join('')}</div><div id="feedback"></div><div class="qactions"><button class="btn quiet" id="quitBtn">← 回首頁</button><button class="btn primary" id="nextBtn" hidden>${index===activeQuestions.length-1?'查看成績':'下一題　→'}</button></div></section>`;main.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.choice)));document.querySelector('#quitBtn').onclick=home;document.querySelector('#nextBtn').onclick=next;}
function answer(choice){if(locked)return;locked=true;const q=activeQuestions[index];if(choice===q.a){score+=10;wrong.delete(q.id)}else wrong.add(q.id);if(score>best){best=score;localStorage.setItem('gardenBestV2',String(best))}persist();main.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');if(j===choice&&j!==q.a)b.classList.add('incorrect')});showFeedback(q,choice);document.querySelector('#nextBtn').hidden=false;refreshStats()}
function showFeedback(q,choice){main.querySelectorAll('.opt').forEach((b,j)=>{if(j===q.a)b.classList.add('correct');if(j===choice&&j!==q.a)b.classList.add('incorrect');b.disabled=true});const fb=document.querySelector('#feedback');fb.innerHTML=`<div class="feedback"><div class="feedback-head ${choice===q.a?'good':'bad'}">${choice===q.a?'✓ 答對了，繼續保持！':`📖 正確答案：${letters[q.a]}. ${esc(q.opts[q.a])}`}</div><div class="explain"><b>${esc(q.ref)}・解析</b><br>${esc(q.ex)}</div><div class="analysis"><div class="analysis-title">🔎 每個選項都看懂</div>${q.why.map((text,j)=>`<div class="analysis-row"><b>${letters[j]}.</b><span class="explain">${esc(text)}</span></div>`).join('')}</div><div class="memory"><b>🎯 記憶小卡</b><br>${esc(q.key)}</div></div>`}
function next(){if(index<activeQuestions.length-1){index++;renderQuestion()}else result()}
function result(){page='result';setNav('#navQuiz');const correct=score/10;main.innerHTML=`<section class="view end"><div class="eyebrow">CHALLENGE COMPLETE</div><h1>這一輪完成了！</h1><div class="scorebig">${score}<span style="font-size:19px;color:#89948a"> / 100</span></div><p>${score===100?'太棒了，這回全答對！':score>=70?'做得很好，回顧錯題就能再往前一步。':'每一次練習都在累積。看看解析，再來一輪吧。'}</p><div class="resultgrid"><div class="resultbox"><b>${correct}</b><span>答對題數</span></div><div class="resultbox"><b>${wrong.size}</b><span>收藏錯題</span></div><div class="resultbox"><b>${best}</b><span>個人最高分</span></div></div><div class="actions" style="justify-content:center"><button class="btn primary" id="again">再挑戰一次　↻</button><button class="btn secondary" id="reviewNow">複習錯題　→</button><button class="btn quiet" id="homeNow">回花園首頁</button></div></section>`;document.querySelector('#again').onclick=start;document.querySelector('#reviewNow').onclick=review;document.querySelector('#homeNow').onclick=home}
function fillPractice(){page='fill';index=0;score=0;activeFill=[...fillQuestions].sort(()=>Math.random()-.5).slice(0,10);setNav('#navFill');renderFill()}
function renderFill(){const q=activeFill[index];locked=false;main.innerHTML=`<section class="view"><div class="question-head"><span class="pill">🧩　${esc(q.topic)}</span><span class="qcount">第 ${index+1} / ${activeFill.length} 題</span></div><div class="progress"><i style="width:${(index+1)/activeFill.length*100}%"></i></div><h1 class="qtext">${esc(q.q)}</h1><textarea id="fillAnswer" class="fillarea" placeholder="輸入你的答案…" aria-label="填充題作答"></textarea><div id="fillFeedback"></div><div class="qactions"><button class="btn quiet" id="quitFill">← 回首頁</button><button class="btn primary" id="revealFill">查看擬答　＋</button><button class="btn primary" id="nextFill" hidden>${index===activeFill.length-1?'查看結果':'下一題　→'}</button></div></section>`;document.querySelector('#quitFill').onclick=home;document.querySelector('#revealFill').onclick=()=>{if(locked)return;locked=true;const fb=document.querySelector('#fillFeedback');fb.innerHTML=`<div class="feedback"><div class="feedback-head">📝 參考擬答</div><div class="explain">${esc(q.key)}</div><div class="memory"><b>自我檢核</b><br>確認答案是否包含核心概念；若未掌握，加入錯題複習。</div><div class="actions"><button class="btn secondary" id="markKnow">我會了　✓</button><button class="btn quiet" id="markAgain">還要再練　↻</button></div></div>`;document.querySelector('#fillAnswer').disabled=true;document.querySelector('#revealFill').hidden=true;document.querySelector('#nextFill').hidden=false;document.querySelector('#markKnow').onclick=()=>{if(document.querySelector('#markKnow').disabled)return;document.querySelector('#markKnow').disabled=true;document.querySelector('#markAgain').disabled=true;score+=10;wrong.delete(q.id);persist();showToast('已標記掌握')};document.querySelector('#markAgain').onclick=()=>{if(document.querySelector('#markAgain').disabled)return;document.querySelector('#markKnow').disabled=true;document.querySelector('#markAgain').disabled=true;wrong.add(q.id);persist();showToast('已加入錯題複習')}};document.querySelector('#nextFill').onclick=()=>{if(index<activeFill.length-1){index++;renderFill()}else fillResult()}}
function fillResult(){page='fillresult';setNav('#navFill');main.innerHTML=`<section class="view end"><div class="eyebrow">FILL IN REVIEW</div><h1>填充練習完成！</h1><div class="scorebig">${score}<span style="font-size:19px;color:#89948a"> / 100</span></div><p>每題查看擬答後，請依自己是否掌握標記「我會了」或「還要再練」。未掌握的題目已加入錯題複習。</p><div class="actions" style="justify-content:center"><button class="btn primary" id="fillAgain">再練一回　↻</button><button class="btn secondary" id="fillReview">查看錯題　→</button><button class="btn quiet" id="fillHome">回首頁</button></div></section>`;document.querySelector('#fillAgain').onclick=fillPractice;document.querySelector('#fillReview').onclick=review;document.querySelector('#fillHome').onclick=home}
function review(){page='review';setNav('#navReview');const items=[...allQuestions,...fillQuestions].filter(q=>wrong.has(q.id));if(!items.length){main.innerHTML=`<section class="view empty"><h2>目前沒有錯題</h2><p>開始闖關或填充練習後，未掌握的題目會收藏在這裡。</p><button class="btn primary" id="practiceNow">開始練習　→</button></section>`;document.querySelector('#practiceNow').onclick=start;return}main.innerHTML=`<section class="view"><div class="eyebrow">GENTLE REVIEW</div><h1 style="font-size:30px;margin:7px 0">錯題複習 <span style="font-size:15px;color:var(--muted)">${items.length} 題</span></h1><p style="color:var(--muted);font-size:13px;line-height:1.7;margin-top:0">再看一次題目、答案和解析。掌握後可以把它從收藏中移除。</p>${items.map(q=>`<article class="reviewrow"><h3>${esc(q.q)}</h3>${q.opts?`<p class="ans">正確答案：${letters[q.a]}. ${esc(q.opts[q.a])}</p><p><b>解析：</b>${esc(q.ex)}</p><p><b>記憶小卡：</b>${esc(q.key)}</p>`:`<p><b>參考擬答：</b>${esc(q.key)}</p>`}<button class="btn secondary clearOne" data-id="${esc(q.id)}" style="padding:9px 12px;font-size:11px;margin-top:5px">我已掌握　✓</button></article>`).join('')}<div class="actions"><button class="btn primary" id="continue">繼續挑戰　→</button><button class="btn quiet" id="clearAll">清空錯題收藏</button></div></section>`;main.querySelectorAll('.clearOne').forEach(b=>b.onclick=()=>{wrong.delete(String(b.dataset.id));persist();review();showToast('已從錯題收藏移除')});document.querySelector('#continue').onclick=start;document.querySelector('#clearAll').onclick=()=>{wrong.clear();persist();review();showToast('錯題收藏已清空')}}
document.querySelector('#navHome').onclick=home;document.querySelector('#navQuiz').onclick=start;document.querySelector('#navFill').onclick=fillPractice;document.querySelector('#navWriting').onclick=writing;document.querySelector('#navReview').onclick=review;refreshStats();home();
})();
</script>
