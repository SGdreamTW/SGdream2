<style>

*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:'Nunito','Noto Sans TC',system-ui,sans-serif;background:radial-gradient(ellipse at 8% 9%,#e9efdf 0,transparent 28%),radial-gradient(ellipse at 95% 40%,#f7e8dd 0,transparent 24%),var(--paper)}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid #71966c;outline-offset:3px}.wrap{width:min(1100px,100% - 36px);margin:auto;padding:25px 0 48px}.top{display:flex;align-items:center;gap:14px;margin-bottom:23px}.brandmark{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:#e4eddc;font-size:28px;box-shadow:inset 0 0 0 1px #ffffffb5}.brand{font-size:19px;font-weight:900;letter-spacing:.02em}.brand small{display:block;color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.04em}.topscore{margin-left:auto;background:#fffefa;border:1px solid var(--line);border-radius:999px;padding:9px 15px;font-size:13px;font-weight:800}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}.side,.maincard{background:#fffefaed;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.side{padding:19px;position:sticky;top:20px}.side-title{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:900;margin:2px 5px 12px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;border-radius:13px;text-align:left;padding:11px 12px;font-size:14px;font-weight:800}.nav button:hover,.nav button.active{background:var(--pale);color:var(--deep)}.side-rule{height:1px;background:var(--line);margin:18px 2px}.mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini{background:#f7f5ed;border-radius:15px;padding:11px}.mini span{display:block;color:var(--muted);font-size:11px;font-weight:700}.mini b{display:block;font-size:19px;margin-top:2px}.side-note{font-size:11px;line-height:1.65;color:var(--muted);margin:14px 4px 0}.maincard{padding:clamp(20px,4vw,42px);min-height:600px;overflow:hidden}.view{animation:appear .24s ease}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.eyebrow{font-size:11px;color:var(--deep);letter-spacing:.14em;font-weight:900}.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:center;min-height:390px}.hero h1{font-size:clamp(30px,5vw,51px);line-height:1.22;letter-spacing:-.04em;margin:12px 0}.hero p{line-height:1.85;color:#66766a;max-width:470px}.heroart{min-height:240px;border-radius:25px;background:linear-gradient(145deg,#eef2e6,#f9ebdf);display:grid;place-items:center;position:relative;overflow:hidden}.sun{width:148px;height:148px;border-radius:50%;display:grid;place-items:center;background:#f8efcc;font-size:76px;box-shadow:0 12px 30px #bdac6330}.float{position:absolute;font-size:25px;animation:bob 3.5s ease-in-out infinite}.f1{top:24px;left:28px}.f2{right:30px;top:57px;animation-delay:.6s}.f3{left:42px;bottom:28px;animation-delay:1.1s}.f4{right:44px;bottom:25px;animation-delay:.3s}@keyframes bob{50%{transform:translateY(-7px) rotate(4deg)}}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:900;transition:.16s}.btn:hover{transform:translateY(-1px)}.primary{background:var(--deep);color:#fff;box-shadow:0 5px 12px #5274572c}.secondary{background:var(--pale);color:var(--deep)}.quiet{background:#f5f2e9;color:#69796d}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:25px 0 12px}.section-head h2{margin:0;font-size:18px}.section-head span{font-size:12px;color:var(--muted)}.topic-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.topic{background:#f7f5ed;border-radius:15px;padding:13px 10px;text-align:center}.topic i{font-style:normal;font-size:20px;display:block}.topic span{font-size:11px;font-weight:800;color:#66766a}.source{margin-top:18px;border:1px solid #ebe5d3;background:#fbf8ee;border-radius:14px;padding:12px 14px;font-size:11px;color:#778174;line-height:1.7}.question-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{border-radius:999px;background:var(--pale);color:var(--deep);padding:7px 11px;font-size:11px;font-weight:900}.qcount{color:var(--muted);font-size:12px;font-weight:800}.progress{height:8px;border-radius:99px;background:#eeece3;margin:14px 0 27px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#9cba86,#668967);border-radius:99px;transition:width .4s}.qtext{font-size:clamp(20px,3vw,27px);line-height:1.55;letter-spacing:-.02em;margin:0 0 20px}.opts{display:grid;gap:10px}.opt{width:100%;display:flex;align-items:flex-start;gap:12px;text-align:left;background:white;border:1.5px solid var(--line);border-radius:15px;padding:14px 15px;transition:.16s}.opt:hover:not(:disabled){border-color:#9ab18e;background:#fbfdf8;transform:translateY(-1px)}.letter{flex:none;width:27px;height:27px;border-radius:9px;display:grid;place-items:center;background:#f3f1e9;color:#758174;font-size:12px;font-weight:900}.opt .opttxt{font-size:14px;line-height:1.55;padding-top:3px;font-weight:700}.opt.correct{border-color:#8fb482;background:#f0f6eb}.opt.correct .letter{background:#dcebd3;color:#456d4b}.opt.incorrect{border-color:#d9a39a;background:#fcf0ed}.opt.incorrect .letter{background:#f4dcd6;color:#a3574e}.opt:disabled{cursor:default}.feedback{margin-top:17px;padding:17px;border-radius:17px;background:#f8f6ee;border:1px solid #ece8db;animation:appear .25s}.feedback-head{font-weight:900;margin-bottom:12px}.feedback-head.good{color:#4c8055}.feedback-head.bad{color:#a4554d}.explain{font-size:13px;line-height:1.8}.analysis{border-top:1px solid #e8e4d8;margin-top:12px;padding-top:11px}.analysis-title{font-size:12px;font-weight:900;margin-bottom:7px}.analysis-row{display:flex;gap:9px;margin:6px 0;align-items:flex-start}.analysis-row b{flex:none;color:var(--deep)}.memory{margin-top:13px;border-radius:12px;background:#eaf0e2;color:#526b4b;padding:11px 12px;font-size:12px;line-height:1.65}.qactions{display:flex;justify-content:space-between;gap:9px;margin-top:17px}.qactions .btn{min-width:128px}.end{text-align:center;max-width:600px;margin:35px auto}.trophy{font-size:66px}.end h1{font-size:32px;margin:8px 0}.scorebig{font-size:52px;color:var(--deep);font-weight:900;line-height:1.15}.end p{color:var(--muted);line-height:1.7}.resultgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:22px 0}.resultbox{background:#f7f5ed;border-radius:15px;padding:13px}.resultbox b{display:block;font-size:22px}.resultbox span{font-size:11px;color:var(--muted);font-weight:800}.reviewrow{border:1px solid var(--line);border-radius:15px;padding:15px;margin-top:10px;background:#fff}.reviewrow h3{font-size:14px;line-height:1.6;margin:0 0 7px}.reviewrow p{font-size:12px;line-height:1.75;margin:5px 0;color:#68766b}.reviewrow .ans{color:#47754e;font-weight:900}.empty{text-align:center;padding:75px 10px}.empty .emoji{font-size:49px}.empty h2{margin-bottom:5px}.empty p{font-size:13px;color:var(--muted);line-height:1.7}.foot{text-align:center;color:#8d978c;font-size:11px;padding-top:18px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;background:#35463f;color:white;border-radius:99px;padding:10px 16px;font-size:12px;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.wrap{width:min(100% - 22px,620px);padding-top:15px}.layout{grid-template-columns:1fr;gap:12px}.side{position:static;padding:10px}.side-title,.side-rule,.mini-stats,.side-note{display:none}.nav{grid-template-columns:repeat(2,1fr);gap:5px}.nav button{text-align:center;padding:10px 5px;font-size:12px}.maincard{padding:22px 17px;min-height:550px}.hero{grid-template-columns:1fr;gap:20px;min-height:auto}.heroart{min-height:180px;grid-row:1}.sun{width:118px;height:118px;font-size:61px}.hero h1{font-size:35px;margin:8px 0}.hero p{font-size:14px}.topic-grid{grid-template-columns:repeat(2,1fr)}.section-head{margin-top:20px}.qactions .btn{min-width:0;flex:1;padding:12px 10px}.topscore{padding:8px 11px}.brand{font-size:17px}.exam-grid{grid-template-columns:1fr}.chapter-grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
.exam-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:17px 0}.exam-stat{border:1px solid var(--line);background:#fffefa;border-radius:15px;padding:13px}.exam-stat b{display:block;font-size:17px}.exam-stat span{font-size:11px;color:var(--muted);line-height:1.5}.chapter-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}.chapter{background:#f7f5ed;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.5}.chapter b{color:var(--deep)}.writing-card{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.writing-card h3{font-size:14px;line-height:1.7;margin:0}.writing-card textarea{width:100%;min-height:100px;border:1px solid var(--line);border-radius:12px;padding:11px;margin-top:12px;font:inherit;font-size:13px;line-height:1.7;resize:vertical;background:#fffefa}.writing-card textarea:focus{outline:2px solid #9db88d;border-color:transparent}.answer-key{display:none;background:#eef3e7;border-radius:12px;padding:12px;margin-top:10px;font-size:12px;line-height:1.8;color:#52674c}.answer-key.open{display:block}.writing-label{font-size:11px;font-weight:900;color:var(--deep);letter-spacing:.08em}@media(max-width:760px){.exam-grid{grid-template-columns:1fr}.chapter-grid{grid-template-columns:1fr}}
</style>

<body>
<div class="wrap">
<header class="top"><div class="brandmark">🌷</div><div class="brand">輔導小花園<small>COUNSELING STUDY GARDEN</small></div><div class="topscore">⭐ <span id="topScore">0</span> 分</div></header>
<div class="layout">
<aside class="side"><div class="side-title">學習選單</div><nav class="nav"><button id="navHome" class="active">🏡　花園首頁</button><button id="navQuiz">📚　10題闖關</button><button id="navWriting">✍️　簡答申論</button><button id="navReview">🔁　錯題複習 <span id="mistakeBadge"></span></button></nav><div class="side-rule"></div><div class="side-title">本次進度</div><div class="mini-stats"><div class="mini"><span>最高得分</span><b id="bestScore">0</b></div><div class="mini"><span>錯題收藏</span><b id="mistakeCount">0</b></div></div><p class="side-note">每題作答後可看逐選項解析；也能用書寫區練習簡答與申論。</p></aside>
<main class="maincard" id="main" aria-live="polite"></main>
</div><footer class="foot">🌱 慢慢累積，讓知識開花。</footer>
</div><div class="toast" id="toast" role="status"></div>
<script>
(()=>{'use strict';
const questions=[
{id:'q1',ref:'2026 考古題選擇題 1',chapter:1,topic:'輔導基本概念',icon:'🧭',q:'諮商員遇有心理疾病個案時，應如何處理？',opts:['輔導室主要對象是有心理問題的學生','學生輔導需由專業人員負責，一般教師不宜介入','轉介給精神科醫生','輔導室主要工作是心理測驗與建立學生資料'],a:2,ex:'DOCX 標示的正確答案是轉介給精神科醫生。題目考查輔導工作者遇到心理疾病個案時的專業轉介。',why:['題目問心理疾病個案的處置，不是界定輔導室對象。','考古題將此敘述列為錯誤選項；一般教師不宜介入不是本題答案。','正確。這是 DOCX 標示的正確答案。','考古題將此敘述列為錯誤選項，且沒有回答個案處置方式。'],key:'遇到心理疾病個案：依考古題選擇專業轉介。'},
{id:'q4',ref:'2026 考古題選擇題 4',chapter:8,topic:'個別輔導',icon:'🌷',q:'一位較被動、猶豫而不敢進入輔導室的學生，老師如何邀請較恰當？',opts:['承諾裡面有很多好玩的遊戲','注意到學生已到，邀請他進來找舒服的位置坐下','催促學生立刻進來，否則會後悔','威脅不進來就不讓他參加'],a:1,ex:'考古題答案選擇先接納學生已經到場，再以舒服、低壓力的方式邀請入內。',why:['以遊戲作為吸引承諾，並未如答案般先接納學生當下狀態。','正確。語氣承認學生已到，並給予安適入座的選擇。','催促與「會後悔」的說法增加壓迫感。','以取消參加作威脅，與接納式邀請不同。'],key:'邀請猶豫的學生時，先接納、再提供可選擇的舒適安排。'},
{id:'q2-history',ref:'考古題「輔導工作之發展歷史」第 1 題',chapter:2,topic:'輔導工作發展歷史',icon:'📜',q:'依考古題所列資料，我國《兒童福利法》修正公布的時間為何？',opts:['民國 82 年 2 月','民國 79 年 1 月','民國 69 年 6 月','民國 62 年 2 月'],a:0,ex:'此題依據 DOCX 中「輔導工作之發展歷史」段落的標示答案，選項為民國 82 年 2 月。本題考的是文件所列的歷史年份。',why:['正確。DOCX 標示的答案為民國 82 年 2 月。','這是題目中的干擾年份，不是 DOCX 標示答案。','這是題目中的干擾年份，不是 DOCX 標示答案。','這是題目中的干擾年份，不是 DOCX 標示答案。'],key:'按本份考古題記憶歷史時間；這是歷史題，不代表現行法規說明。'},
{id:'q3-org',ref:'考古題「組織人員與輔導方案」第 1 題',chapter:3,topic:'輔導組織與方案',icon:'🏫',q:'學校輔導工作的服務對象是誰？',opts:['全體學生','只有低學業成就學生','只有行為偏差學生','只有資優學生'],a:0,ex:'考古題答案為全體學生。其餘選項都把服務對象限縮為單一學生群體。',why:['正確。題目答案為全體學生。','低學業成就學生是其中一群，不是全部服務對象。','行為偏差學生是其中一群，不是全部服務對象。','資優學生是其中一群，不是全部服務對象。'],key:'學校輔導的對象：全體學生。'},
{id:'q4-life',ref:'考古題「生活輔導」第 10 題',chapter:4,topic:'生活輔導',icon:'🌿',q:'教師把反菸毒教育融入健康課程，讓學生理解危害並學會抗拒誘惑，屬於哪一類生活輔導？',opts:['治療性的生活輔導','預防性的生活輔導','恢復性的生活輔導','發展性的生活輔導'],a:1,ex:'考古題答案為預防性的生活輔導。題幹重點是透過課程降低問題發生的可能。',why:['題目描述的是事前教育，不是處理已發生的問題。','正確。以課程提升認識並預防不良事件，符合本題答案。','「恢復性」不是題目列出的生活輔導分類答案。','考古題答案不是發展性，而是預防性。'],key:'事前宣導、降低風險 → 預防性生活輔導。'},
{id:'q5-learn',ref:'考古題「學習輔導」第 19 題',chapter:5,topic:'學習輔導',icon:'📚',q:'依 Bandura 自我效能預期理論設計學習輔導時，下列哪一項不適合作為策略？',opts:['安排能獲得成就感的經驗','運用同儕楷模示範','肯定學科表現的進步','懲罰成績不佳的學生抄寫課文'],a:3,ex:'考古題答案為懲罰成績不佳的學生抄寫課文。其他選項分別呼應成功經驗、楷模和表現回饋；懲罰並非題目所列的自我效能策略。',why:['正向成功經驗是題目列出的策略之一。','同儕楷模是題目列出的策略之一。','肯定進步是題目列出的策略之一。','正確。考古題指出懲罰抄寫不是此理論的輔導策略。'],key:'自我效能策略：成功經驗、楷模示範、鼓勵進步。'},
{id:'q12-learn',ref:'考古題「學習輔導」第 12 題',chapter:5,topic:'學習輔導',icon:'⏱️',q:'六六討論法中，每組六人、每人發言一分鐘、討論六分鐘；下列哪項不是其必要條件？',opts:['每組六個人','每人發言一分鐘','討論時間六分鐘','每人提出六個問題'],a:3,ex:'考古題答案為「每人提出六個問題」。題幹已列出此討論法的組數、人數與時間安排。',why:['這是題幹列出的條件。','這是題幹列出的條件。','這是題幹列出的條件。','正確。題幹沒有要求每人提出六個問題。'],key:'六六法：六人一組、六分鐘、每人一分鐘。'},
{id:'q4-career',ref:'考古題「生涯輔導」第 4 題',chapter:6,topic:'生涯輔導',icon:'🧭',q:'一位 25 歲、已有幾年工作經驗並希望在工作上建立表現的成人，較符合 Super 生涯發展的哪個階段？',opts:['試探階段','維持階段','建立階段','成長階段'],a:2,ex:'考古題答案為建立階段。題幹描述已進入職場並致力於建立工作表現。',why:['考古題答案不是試探階段。','考古題答案不是維持階段。','正確。符合題幹的職場建立情境，也是考古題標示的答案。','成長階段不是題幹描述的階段。'],key:'依本題情境：進入職場、力求建立表現 → 建立階段。'},
{id:'q4-data',ref:'考古題「學生資料搜集與運用」第 4 題',chapter:7,topic:'學生資料與測驗',icon:'📋',q:'一項測驗能測出它原本想測量之行為特性的程度，稱為什麼？',opts:['信度','效度','常模','效標'],a:1,ex:'考古題答案為效度。題幹描述的是測驗是否測到預定目標。',why:['信度描述測量的一致性，不是本題定義。','正確。效度關乎測驗是否測到所欲測量的特性。','常模是比較分數的參照資料，不是本題定義。','效標是評估時參照的標準，不是本題所問的測量品質。'],key:'效度：測驗是否測到原本要測的內容。'},
{id:'q8-empathy',ref:'考古題諮商名詞解析',chapter:8,topic:'個別輔導技巧',icon:'💛',q:'個案說「好朋友不理我了，我好傷心。」老師回應「朋友不理你，讓你覺得好難過。」這主要使用哪一項技巧？',opts:['同理','情感反映','澄清','面質'],a:0,ex:'DOCX 直接以這段對話作為同理的例子，說明老師準確理解並傳達了個案的傷心感受。',why:['正確。DOCX 將這個回應標示為同理。','情感反映也會捕捉情緒，但本題原解析將此例歸為同理。','澄清會針對模糊訊息進一步詢問。','面質會指出言行或感受間的差異。'],key:'同理：進入並理解當事人的感受，再把理解傳達給對方。'}
];
const letters=['A','B','C','D'];
let page='home',index=0,score=0,locked=false,wrong=new Set();
let best=+(localStorage.getItem('gardenBestV2')||0);try{wrong=new Set(JSON.parse(localStorage.getItem('gardenWrongV2')||'[]').filter(id=>questions.some(q=>String(q.id)===String(id))));}catch{};
const main=document.querySelector('#main');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){localStorage.setItem('gardenWrongV2',JSON.stringify([...wrong]));localStorage.setItem('gardenBestV2',String(best));refreshStats()}
function refreshStats(){document.querySelector('#topScore').textContent=score;document.querySelector('#bestScore').textContent=best;document.querySelector('#mistakeCount').textContent=wrong.size;document.querySelector('#mistakeBadge').textContent=wrong.size?`(${wrong.size})`:''}
function setNav(which){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.querySelector(which).classList.add('active')}
function showToast(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function writing(){page='writing';setNav('#navWriting');const prompts=[
{type:'簡答／名詞解釋 1',q:'列出考古題答案中的四種兒童虐待類型。',key:'精神虐待、身體虐待、性虐待、忽略。'},
{type:'簡答／名詞解釋 2',q:'說明「家庭暴力」的意義。',key:'依 DOCX 所列定義：家庭成員間實施身體或精神上的不法侵害行為。'},
{type:'簡答／名詞解釋 3',q:'說明「校園霸凌」的意義。',key:'依 DOCX 所列要點：學生長期、重複遭一人或多人欺負／騷擾，或被鎖定為對象，並因此承受身心痛苦。'},
{type:'簡答／名詞解釋 4',q:'選一種諮商技巧，寫出意義並舉一個簡短例子。',key:'可選：簡述語意（用自己的話回饋談話重點）、情感反映（辨識並回饋情緒）、澄清（詢問模糊處）、具體化（把抽象描述轉成具體情境）、面質（指出不一致，需建立良好關係後使用）。'},
{type:'申論題 1',q:'教師發現學生常有傷痕且表情憂傷，懷疑遭受虐待。依考古題解析，說明確認與後續處理的作答要點。',key:'作答要點：①留意不尋常傷口（如刀傷、瘀青）；②留意異常行為或心理反應（如翹課、恐懼）；③留意學生透露的相關事件線索；④依文件所列答案，確認有受虐事實後，於 24 小時內向主管機關通報。'},
{type:'申論題 2',q:'為國小學生擬定憂鬱與自傷防治計畫，分別說明初級、二級、三級預防的對象、目標、策略／行動與預期成果。',key:'初級：全體學生；情緒覺察、壓力調適、生命教育、支持性班級與教師辨識；提升情緒管理、營造正向氣氛。二級：高風險學生；篩檢、追蹤、個別／小團體輔導、親師合作；及早介入、避免惡化。三級：已有自傷或高度危機學生；危機處理、確保安全、專業轉介、個案追蹤與復原支持；降低再發風險並建立轉介系統。'}
];main.innerHTML=`<section class="view"><div class="eyebrow">WRITE & RECALL</div><h1 style="font-size:30px;margin:7px 0">簡答與申論練習</h1><p style="color:var(--muted);font-size:13px;line-height:1.7">先自己寫，再展開檢核要點。這裡不會自動評分，方便你用自己的話練習作答。</p>${prompts.map((p,i)=>`<article class="writing-card"><div class="writing-label">${p.type}</div><h3>${p.q}</h3><textarea aria-label="作答區 ${i+1}" placeholder="在這裡整理你的答案…"></textarea><button class="btn secondary reveal" data-id="key${i}" style="padding:9px 12px;font-size:11px;margin-top:8px">查看作答要點　＋</button><div class="answer-key" id="key${i}"><b>自我檢核</b><br>${p.key}</div></article>`).join('')}</section>`;main.querySelectorAll('.reveal').forEach(b=>b.onclick=()=>{const key=document.getElementById(b.dataset.id);key.classList.toggle('open');b.textContent=key.classList.contains('open')?'收起作答要點　−':'查看作答要點　＋'})}
function home(){page='home';setNav('#navHome');main.innerHTML=`<section class="view"><div class="hero"><div><div class="eyebrow">MIDTERM REVIEW · 2026</div><h1>把複習，變成一座<br>會開花的小花園。</h1><p>用 10 題小闖關練選擇題，再用書寫練習整理簡答與申論。題目來自你提供的 2026 教師考古題，並按課本範圍編排。</p><div class="actions"><button class="btn primary" id="startBtn">開始 10 題闖關　→</button><button class="btn secondary" id="writeBtn">簡答與申論練習　✍️</button><button class="btn quiet" id="wrongBtn">看看錯題　↗</button></div></div><div class="heroart" aria-label="花朵與小植物插畫"><span class="float f1">✦</span><span class="float f2">🌿</span><span class="float f3">🌼</span><span class="float f4">✿</span><div class="sun">🌷</div></div></div><div class="section-head"><h2>期中考資訊</h2><span>依你提供的範圍圖片</span></div><div class="exam-grid"><div class="exam-stat"><b>80 分鐘</b><span>13:40–15:00</span></div><div class="exam-stat"><b>25 題</b><span>選擇題</span></div><div class="exam-stat"><b>4 + 2 題</b><span>簡答／名詞解釋 + 申論</span></div></div><div class="section-head"><h2>課本複習範圍</h2><span>第 1–8 章，至第 241 頁</span></div><div class="chapter-grid"><div class="chapter"><b>第 1 章</b>　輔導之基本概念 · p.1</div><div class="chapter"><b>第 2 章</b>　輔導工作之發展歷史 · p.33</div><div class="chapter"><b>第 3 章</b>　輔導組織、人員與輔導方案 · p.51</div><div class="chapter"><b>第 4 章</b>　生活輔導 · p.79</div><div class="chapter"><b>第 5 章</b>　學習輔導 · p.113</div><div class="chapter"><b>第 6 章</b>　生涯輔導 · p.139</div><div class="chapter"><b>第 7 章</b>　學生資料的搜集與運用 · p.185</div><div class="chapter"><b>第 8 章</b>　個別輔導 · p.215–241</div></div><div class="source"><b>題庫與來源</b><br>10 題闖關採用考古題中的原題或依其名詞解析改寫，並附正解、逐選項說明與記憶卡。課本是掃描檔；範圍章名及頁碼依掃描本目錄核對。圖片另提到 PPT 與相關資料，這次沒有收到那些檔案，因此未納入題目。</div></section>`;document.querySelector('#startBtn').onclick=start;document.querySelector('#writeBtn').onclick=writing;document.querySelector('#wrongBtn').onclick=review;refreshStats()}
function start(){page='quiz';index=0;score=0;locked=false;refreshStats();setNav('#navQuiz');renderQuestion()}
function renderQuestion(){const q=questions[index];locked=false;main.innerHTML=`<section class="view"><div class="question-head"><span class="pill">${q.icon}　${esc(q.topic)}</span><span class="qcount">第 ${index+1} / ${questions.length} 題</span></div><div class="progress" aria-label="答題進度"><i style="width:${(index+1)/questions.length*100}%"></i></div><h1 class="qtext">${esc(q.q)}</h1><div class="opts">${q.opts.map((o,j)=>`<button class="opt" data-choice="${j}"><span class="letter">${letters[j]}</span><span class="opttxt">${esc(o)}</span></button>`).join('')}</div><div id="feedback"></div><div class="qactions"><button class="btn quiet" id="quitBtn">← 回首頁</button><button class="btn primary" id="nextBtn" hidden>${index===questions.length-1?'查看成績':'下一題　→'}</button></div></section>`;main.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.choice)));document.querySelector('#quitBtn').onclick=home;document.querySelector('#nextBtn').onclick=next;}
function answer(choice){if(locked)return;locked=true;const q=questions[index];if(choice===q.a){score+=10;wrong.delete(q.id)}else wrong.add(q.id);if(score>best){best=score;localStorage.setItem('gardenBestV2',String(best))}persist();main.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');if(j===choice&&j!==q.a)b.classList.add('incorrect')});showFeedback(q,choice);document.querySelector('#nextBtn').hidden=false;refreshStats()}
function showFeedback(q,choice){main.querySelectorAll('.opt').forEach((b,j)=>{if(j===q.a)b.classList.add('correct');if(j===choice&&j!==q.a)b.classList.add('incorrect');b.disabled=true});const fb=document.querySelector('#feedback');fb.innerHTML=`<div class="feedback"><div class="feedback-head ${choice===q.a?'good':'bad'}">${choice===q.a?'✓ 答對了，繼續保持！':`📖 正確答案：${letters[q.a]}. ${esc(q.opts[q.a])}`}</div><div class="explain"><b>${esc(q.ref)}・解析</b><br>${esc(q.ex)}</div><div class="analysis"><div class="analysis-title">🔎 每個選項都看懂</div>${q.why.map((text,j)=>`<div class="analysis-row"><b>${letters[j]}.</b><span class="explain">${esc(text)}</span></div>`).join('')}</div><div class="memory"><b>🎯 記憶小卡</b><br>${esc(q.key)}</div></div>`}
function next(){if(index<questions.length-1){index++;renderQuestion()}else result()}
function result(){page='result';setNav('#navQuiz');const correct=score/10;main.innerHTML=`<section class="view end"><div class="trophy">${score===100?'🏆':score>=70?'🌷':'🌱'}</div><div class="eyebrow">CHALLENGE COMPLETE</div><h1>這一輪完成了！</h1><div class="scorebig">${score}<span style="font-size:19px;color:#89948a"> / 100</span></div><p>${score===100?'太棒了，這回全答對！':score>=70?'做得很好，回顧錯題就能再往前一步。':'每一次練習都在累積。看看解析，再來一輪吧。'}</p><div class="resultgrid"><div class="resultbox"><b>${correct}</b><span>答對題數</span></div><div class="resultbox"><b>${wrong.size}</b><span>收藏錯題</span></div><div class="resultbox"><b>${best}</b><span>個人最高分</span></div></div><div class="actions" style="justify-content:center"><button class="btn primary" id="again">再挑戰一次　↻</button><button class="btn secondary" id="reviewNow">複習錯題　→</button><button class="btn quiet" id="homeNow">回花園首頁</button></div></section>`;document.querySelector('#again').onclick=start;document.querySelector('#reviewNow').onclick=review;document.querySelector('#homeNow').onclick=home}
function review(){page='review';setNav('#navReview');const items=questions.filter(q=>wrong.has(q.id));if(!items.length){main.innerHTML=`<section class="view empty"><div class="emoji">🌼</div><h2>花園裡還沒有錯題</h2><p>開始闖關後，答錯的題目會自動收藏在這裡。<br>練習不怕錯，記得回來看看解析就好。</p><button class="btn primary" id="practiceNow">開始闖關　→</button></section>`;document.querySelector('#practiceNow').onclick=start;return}main.innerHTML=`<section class="view"><div class="eyebrow">GENTLE REVIEW</div><h1 style="font-size:30px;margin:7px 0">錯題小花圃 <span style="font-size:15px;color:var(--muted)">${items.length} 題</span></h1><p style="color:var(--muted);font-size:13px;line-height:1.7;margin-top:0">再看一次題目、答案和記憶小卡。掌握後可以把它從收藏中移除。</p>${items.map(q=>`<article class="reviewrow"><h3>${q.icon} ${esc(q.q)}</h3><p class="ans">正確答案：${letters[q.a]}. ${esc(q.opts[q.a])}</p><p><b>解析：</b>${esc(q.ex)}</p><p><b>記憶小卡：</b>${esc(q.key)}</p><button class="btn secondary clearOne" data-id="${esc(q.id)}" style="padding:9px 12px;font-size:11px;margin-top:5px">我已掌握　✓</button></article>`).join('')}<div class="actions"><button class="btn primary" id="continue">繼續挑戰　→</button><button class="btn quiet" id="clearAll">清空錯題收藏</button></div></section>`;main.querySelectorAll('.clearOne').forEach(b=>b.onclick=()=>{wrong.delete(String(b.dataset.id));wrong.delete(+b.dataset.id);persist();review();showToast('已從錯題收藏移除')});document.querySelector('#continue').onclick=start;document.querySelector('#clearAll').onclick=()=>{wrong.clear();persist();review();showToast('錯題收藏已清空')}}
document.querySelector('#navHome').onclick=home;document.querySelector('#navQuiz').onclick=start;document.querySelector('#navWriting').onclick=writing;document.querySelector('#navReview').onclick=review;refreshStats();home();
})();
</script>
</body>
